/* ---------- Vue Portefeuilles ---------- */
function vuePortefeuilles(){
  var m = S.moisActif;
  var tous = etatPortefeuilles(m);
  var actifs = portefeuillesActifs(m);
  var sansBudget = tous.filter(function(p){ return !p.budget; });
  var T = totauxPortefeuilles(m);
  var h = "";

  if(!actifs.length){
    h += '<div class="vide d1"><h3>Vos portefeuilles</h3>'
      + '<p>Un portefeuille, c\'est une enveloppe mensuelle par thème : la cuisine, les loisirs, le transport… '
      + 'Vous lui donnez un budget, vous y rattachez vos dépenses, et vous voyez fondre ce qu\'il reste. '
      + 'Le budget reste flexible : réajustez-le quand vous voulez.</p></div>';
  } else {
    // Synthèse globale
    var couleurT = T.depasses ? "var(--rouge)" : T.aSurveiller ? "var(--accent)" : "var(--vert)";
    h += '<div class="carte d1"><div class="titre-bloc"><div>'
      + '<span class="eyebrow">Ce mois-ci</span><h2>Vue d\'ensemble</h2></div></div>'
      + '<div class="grille g3">'
      + kpi("Budget total alloué", fmtD(T.budget), T.nb + (T.nb>1?" portefeuilles":" portefeuille"))
      + kpi("Déjà dépensé", fmtD(T.depense), pct(T.part)+" du budget", T.part>=100?"alerte":T.part>=80?"":"bien")
      + kpi("Reste disponible", fmtD(T.restant), T.restant<0 ? "budget dépassé" : "jusqu\'à la fin du mois", T.restant<0?"alerte":"bien")
      + '</div>';
    if(T.horsPortefeuille > 0){
      h += '<p class="aide" style="margin-top:var(--space-4)">'
        + '<strong>'+fmtD(T.horsPortefeuille)+'</strong> de dépenses ce mois-ci ne sont rattachées à aucun portefeuille budgété. '
        + 'C\'est normal si elles sont exceptionnelles — sinon, créez le portefeuille correspondant plus bas.</p>';
    }
    h += '</div>';

    // Liste des portefeuilles
    h += '<div class="carte d2"><div class="titre-bloc"><div>'
      + '<span class="eyebrow">Suivi détaillé</span><h2>Mes portefeuilles</h2></div></div>';
    h += '<div class="liste">';
    actifs.forEach(function(p){
      var partAff = Math.min(100, Math.max(0, p.part));
      var etiq = p.statut==="depasse" ? '<span class="tag rouge">dépassé</span>'
               : p.statut==="attention" ? '<span class="tag or">bientôt épuisé</span>'
               : p.statut==="risque" ? '<span class="tag or">rythme trop rapide</span>'
               : '<span class="tag vert">dans les clous</span>';
      var phrase;
      if(p.restant < 0) phrase = 'Dépassé de <strong style="color:var(--rouge)">'+fmt(Math.abs(p.restant))+'</strong>';
      else phrase = 'Reste <strong style="color:'+couleurStatut(p.statut)+'">'+fmt(p.restant)+'</strong>';
      if(p.projete && p.statut!=="depasse" && p.projete > p.budget*1.05)
        phrase += ' · à ce rythme, fin de mois vers '+fmt(p.projete);

      h += '<div class="portef">'
        + '<div class="portef-haut">'
        +   '<span class="portef-nom">'+ech(p.cat.nom)+' '+etiq+'</span>'
        +   '<span class="portef-chiffres num">'+fmt(p.depense)+' <span style="color:var(--subtle)">/ '+fmt(p.budget)+'</span></span>'
        + '</div>'
        + '<div class="jauge"><i class="'+classeJauge(p.statut)+'" style="width:'+partAff+'%"></i></div>'
        + '<div class="portef-bas">'
        +   '<span class="meta">'+phrase+'</span>'
        +   '<span class="portef-actions">'
        +     '<input type="text" inputmode="decimal" autocomplete="off" class="num num-champ portef-champ" '
        +       'value="'+p.budget+'" data-act="budgetPortef" data-id="'+p.cat.id+'" aria-label="Budget de '+ech(p.cat.nom)+'">'
        +     '<button class="btn discret mini" data-act="retirerBudget" data-id="'+p.cat.id+'" title="Retirer le budget">✕</button>'
        +   '</span>'
        + '</div></div>';
    });
    h += '</div></div>';
  }

  // Créer / activer un portefeuille
  h += '<div class="carte d3"><div class="titre-bloc"><div>'
    + '<span class="eyebrow">Ajouter</span><h2>Donner un budget à un poste</h2></div></div>';

  if(sansBudget.length){
    h += '<p class="aide" style="margin-bottom:var(--space-4)">Ces postes existent déjà mais n\'ont pas encore de budget. '
      + 'Le montant suggéré vient de vos dépenses passées — libre à vous de le changer.</p><div class="liste">';
    sansBudget.forEach(function(p){
      var sugg = p.suggere || 0;
      h += '<div class="item">'
        + '<span class="nom">'+ech(p.cat.nom)
        + '<br><span class="meta">'+(p.typique ? 'habituellement '+fmt(p.typique)+' par mois' : 'pas encore d\'historique')+'</span></span>'
        + '<input type="text" inputmode="decimal" autocomplete="off" class="num num-champ portef-champ" '
        +   'placeholder="'+(sugg||"budget")+'" data-act="budgetPortef" data-id="'+p.cat.id+'" aria-label="Budget de '+ech(p.cat.nom)+'">'
        + '</div>';
    });
    h += '</div>';
  }

  h += '<div class="ligne-form" style="margin-top:var(--space-5)">'
    + '<div class="champ"><label for="pfNom">Nouveau portefeuille</label>'
    +   '<input type="text" id="pfNom" placeholder="Cuisine, Loisirs, Transport…"></div>'
    + '<div class="champ"><label for="pfBudget">Budget mensuel</label>'
    +   '<input type="text" inputmode="decimal" autocomplete="off" class="num-champ" id="pfBudget" placeholder="0"></div>'
    + '</div>'
    + '<button class="btn primaire large" data-act="ajoutPortefeuille" style="margin-top:var(--space-4)">Créer le portefeuille</button>'
    + '<p class="aide" style="margin-top:var(--space-4)">Les charges obligatoires (loyer, école, électricité) gardent leur propre '
    + 'système dans l\'onglet Charges : elles se pointent quand elles sont payées, sans budget à surveiller.</p>'
    + '</div>';

  return h;
}

/* ---------- Projets ---------- */

    + '<div class="champ"><label for="pCout">Investissement</label><input type="text" id="pCout" inputmode="decimal" autocomplete="off" placeholder="0" class="num-champ"></div>'
    + '<button class="btn primaire" data-act="ajoutProjet">Ajouter</button></div>'
    + '<p class="aide" style="margin-top:var(--space-4)">Un revenu de projet n\'entre dans votre budget réel qu\'une fois encaissé, dans l\'onglet Revenus. Ici, il ne sert qu\'à préparer les décisions.</p>'
    + '</div>';
  return h;
}

/* ---------- Analyse ---------- */
function vueAnalyse(){
  var m = S.moisActif;
  var sc = scoreSante(m), pa = pareto(m), pv = previsionsCategories(m), an = anomalies(m);
  var c = corridor(m);
  var h = "";

  h += '<div class="carte animate-in"><div class="titre-bloc"><div><h2>Santé financière</h2>'
    + '<p class="aide">Cinq composantes, chacune explicable. Ce n\'est pas une note de morale : c\'est un tableau de bord des points qui cassent en premier.</p></div></div>'
    + '<div class="score-anneau">'+svgScore(sc.total)+'<div class="score-detail">';
  sc.parties.forEach(function(p){
    h += '<div class="score-l"><span>'+p.nom+' <span class="meta">— '+p.detail+'</span></span>'
      + '<span class="num">'+Math.round(p.val)+'/'+p.max+'</span>'
      + '<div class="jauge"><i class="'+(p.val/p.max<0.4?"depasse":p.val/p.max<0.7?"attention":"")+'" style="width:'+(p.val/p.max*100)+'%"></i></div></div>';
  });
  h += '</div></div></div>';

  h += '<div class="carte animate-in d1"><div class="titre-bloc"><div><h3>Revenus contre dépenses</h3>'
    + '<p class="aide">Douze mois. L\'écart entre les deux barres, c\'est votre épargne réelle.</p></div></div>'
    + svgHistorique(m)
    + '<div class="legende"><span><i style="background:var(--vert)"></i>revenus encaissés</span><span><i style="background:var(--rouge)"></i>dépenses totales</span></div></div>';

  h += '<div class="carte animate-in d2"><div class="titre-bloc"><div><h3>Où part l\'argent</h3>'
    + '<p class="aide">Barre pleine : le réel du mois. Trait or : ce que la statistique prévoyait pour ce poste.</p></div></div>'
    + svgCategories(m) + '</div>';

  if(pa.vital.length){
    h += '<div class="carte animate-in d3"><div class="titre-bloc"><div><h3>Loi des 80/20</h3>'
      + '<p class="aide">Sur les quatre derniers mois, '+pa.vital.length+' poste(s) concentrent '+pct(pa.partVital*100)+' de vos dépenses variables. C\'est le seul endroit où un effort change quelque chose.</p></div></div>'
      + '<div class="scroll-x"><table class="tableau"><thead><tr><th>Poste</th><th class="n">Total 4 mois</th><th class="n">Part</th><th class="n">Par mois</th></tr></thead><tbody>';
    pa.lignes.slice(0,8).forEach(function(l){
      var estVital = pa.vital.indexOf(l)>=0;
      h += '<tr'+(estVital?' style="color:var(--text)"':' style="color:var(--muted)"')+'>'
        + '<td data-label="">'+ech(l.cat.nom)+(estVital?' <span class="tag or">décisif</span>':'')+'</td>'
        + '<td class="n" data-label="Total 4 mois">'+fmt(l.montant)+'</td><td class="n" data-label="Part">'+pct(l.montant/pa.total*100)+'</td>'
        + '<td class="n" data-label="Par mois">'+fmt(l.montant/4)+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  var vol = pv.filter(function(p){ return p.moisPresents>=2; });
  if(vol.length){
    h += '<div class="carte animate-in"><div class="titre-bloc"><div><h3>Prévisibilité par poste</h3>'
      + '<p class="aide">Un poste stable se budgète. Un poste imprévisible se plafonne — c\'est lui qui fait exploser les mois difficiles.</p></div></div>'
      + '<div class="scroll-x"><table class="tableau"><thead><tr><th>Poste</th><th>Comportement</th><th class="n">Habituel</th><th class="n">Prévu</th><th class="n">Tendance</th></tr></thead><tbody>';
    vol.forEach(function(p){
      var t = p.tendance;
      h += '<tr><td data-label="">'+ech(p.cat.nom)+'</td>'
        + '<td data-label="Comportement"><span class="tag'+(p.stabilite==="stable"?" vert":p.stabilite==="imprévisible"?" rouge":"")+'">'+p.stabilite+'</span> <span class="meta">±'+pct(p.cv*100)+'</span></td>'
        + '<td class="n" data-label="Habituel">'+fmt(p.typique)+'</td><td class="n" data-label="Prévu">'+fmt(p.prevu)+'</td>'
        + '<td class="n" data-label="Tendance" style="color:'+(t>0?"var(--rouge)":t<0?"var(--vert)":"var(--muted)")+'">'+(t>0?"+":"")+fmt(t)+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  if(an.length){
    h += '<div class="carte animate-in"><div class="titre-bloc"><div><h3>Dépenses hors norme</h3>'
      + '<p class="aide">Repérées par écart à la médiane du poste, méthode robuste : un seul gros mois ne fausse pas la détection.</p></div></div><div class="liste">';
    an.forEach(function(x){
      h += '<div class="item"><span class="nom">'+ech(x.tx.libelle||"Sans libellé")+'<br><span class="meta">'+ech(cat(x.tx.categorieId).nom)+' · '+x.tx.date+' · habituellement '+fmt(x.med)+'</span></span>'
        + '<span class="tag rouge">×'+(Math.round(x.tx.montant/Math.max(1,x.med)*10)/10).toString().replace(".",",")+'</span>'
        + '<span class="mt">'+fmt(x.tx.montant)+'</span></div>';
    });
    h += '</div></div>';
  }

  /* Saisonnalité */
  var mois12 = moisAvecDonnees();
  if(mois12.length >= 12){
    var indices = [];
    for(var k=0;k<12;k++){
      var vals = mois12.filter(function(mm){ return moisEnDate(mm).getMonth()===k; }).map(totalDepensesMois).filter(function(v){return v>0;});
      indices.push({mois:k, val: vals.length?moyenne(vals):0});
    }
    var moyG = moyenne(indices.filter(function(x){return x.val>0;}).map(function(x){return x.val;}));
    h += '<div class="carte animate-in"><div class="titre-bloc"><div><h3>Saisonnalité</h3>'
      + '<p class="aide">Vos mois chers et vos mois calmes, sur '+mois12.length+' mois d\'historique. Anticipez les pics au lieu de les subir.</p></div></div>'
      + '<div class="scroll-x"><table class="tableau"><thead><tr><th>Mois</th><th class="n">Dépense moyenne</th><th class="n">Écart à la normale</th></tr></thead><tbody>';
    indices.filter(function(x){return x.val>0;}).sort(function(a,b){return b.val-a.val;}).forEach(function(x){
      var e = moyG ? (x.val/moyG-1)*100 : 0;
      h += '<tr><td data-label="">'+MOIS_FR[x.mois]+'</td><td class="n" data-label="Dépense moyenne">'+fmt(x.val)+'</td>'
        + '<td class="n" data-label="Écart" style="color:'+(e>8?"var(--rouge)":e<-8?"var(--vert)":"var(--muted)")+'">'+(e>0?"+":"")+pct(e)+'</td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  h += '<div class="carte animate-in"><div class="titre-bloc"><h3>Toutes les recommandations</h3></div>';
  conseils(m).forEach(function(x){
    h += '<div class="conseil '+x.p+'"><span class="pic">'+x.i+'</span><div><h4>'+x.t+'</h4><p>'+x.d+'</p></div></div>';
  });
  h += '<p class="aide" style="margin-top:var(--space-5)">Base de calcul : '+c.nMois+' mois d\'historique, lissage exponentiel α = '+ALPHA+', corridor construit sur les quartiles et l\'écart absolu médian.</p></div>';
  return h;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function val(id){ var e=$(id); return e ? e.value.trim() : ""; }
function nbTexte(txt){ var v = parseFloat(String(txt||"").replace(/\s/g,"").replace(",",".")); return isNaN(v) ? 0 : v; }
function nb(id){ return nbTexte(val(id)); }
function vide(id){ var e=$(id); if(e) e.value=""; }

var A = {
  aller: function(el){ ouvrirVue(el.getAttribute("data-vue")); },

  ajoutDepense: function(){
    var mt = nb("dMontant");
    if(mt<=0){ toast("Indiquez un montant supérieur à zéro."); $("dMontant").focus(); return; }
    S.transactions.push({
      id: uid("t"), date: val("dDate") || dateDefaut(), montant: mt,
      categorieId: val("dCat") || S.categories[0].id,
      libelle: val("dLib"), type:"depense", origine:"manuel"
    });
    vide("dMontant"); vide("dLib");
    majEtRendre("Dépense enregistrée");
    var f = $("dMontant"); if(f) f.focus();
  },

  ajoutCharge: function(){
    var lib = val("chLib"), mt = nb("chMt");
    if(!lib){ toast("Donnez un libellé à cette charge."); return; }
    if(mt<=0){ toast("Indiquez le montant de la charge."); return; }
    S.charges.push({
      id: uid("ch"), libelle: lib, montant: mt,
      categorieId: val("chCat"), jour: Math.min(31, Math.max(1, nb("chJour")||1)),
      frequence: val("chFreq") || "mensuelle", moisAncre: S.moisActif, actif: true
    });
    vide("chLib"); vide("chMt");
    majEtRendre("Charge ajoutée au socle");
  },

  suppCharge: function(el){
    var id = el.getAttribute("data-id");
    confirmer("Supprimer cette charge ?", "Les paiements déjà pointés resteront dans votre historique de dépenses.", function(){
      S.charges = S.charges.filter(function(c){ return c.id!==id; });
      majEtRendre("Charge supprimée");
    });
  },

  basculeCharge: function(el){
    var id = el.getAttribute("data-id"), m = S.moisActif;
    var ch = S.charges.filter(function(c){return c.id===id;})[0];
    if(!ch) return;
    if(chargePayee(m,id)){
      S.transactions = S.transactions.filter(function(t){
        return !(t.origine==="charge" && t.refId===id && t.date.slice(0,7)===m);
      });
      majEtRendre("Charge repassée en attente");
    } else {
      var j = String(Math.min(joursDansMois(m), Math.max(1, ch.jour||1))).padStart(2,"0");
      S.transactions.push({
        id: uid("t"), date: m+"-"+j, montant: ch.montant, categorieId: ch.categorieId,
        libelle: ch.libelle, type:"depense", origine:"charge", refId: id
      });
      majEtRendre("Charge réglée — provision libérée");
    }
  },

  basculeRevenu: function(el){
    var id = el.getAttribute("data-id"), m = S.moisActif;
    var r = S.revenusRecurrents.filter(function(x){return x.id===id;})[0];
    if(!r) return;
    if(revenuEncaisse(m,id)){
      S.transactions = S.transactions.filter(function(t){
        return !(t.origine==="recurrent" && t.refId===id && t.date.slice(0,7)===m);
      });
      majEtRendre("Encaissement annulé");
    } else {
      var j = String(Math.min(joursDansMois(m), Math.max(1, r.jour||1))).padStart(2,"0");
      S.transactions.push({
        id: uid("t"), date: m+"-"+j, montant: r.montant, categorieId: null,
        libelle: r.libelle, type:"revenu", origine:"recurrent", refId: id
      });
      majEtRendre("Revenu encaissé");
    }
  },

  ajoutRevRec: function(){
    var lib = val("rLib"), mt = nb("rMt");
    if(!lib || mt<=0){ toast("Il faut une source et un montant."); return; }
    S.revenusRecurrents.push({
      id: uid("r"), libelle: lib, montant: mt,
      jour: Math.min(31, Math.max(1, nb("rJour")||1)),
      fiabilite: nb("rFiab")||100, actif:true
    });
    vide("rLib"); vide("rMt");
    majEtRendre("Revenu récurrent ajouté");
  },

  suppRevRec: function(el){
    var id = el.getAttribute("data-id");
    S.revenusRecurrents = S.revenusRecurrents.filter(function(r){return r.id!==id;});
    majEtRendre("Revenu récurrent supprimé");
  },

  ajoutRevPonct: function(){
    var mt = nb("rpMt");
    if(mt<=0){ toast("Indiquez un montant."); return; }
    S.transactions.push({
      id: uid("t"), date: val("rpDate")||dateDefaut(), montant: mt, categorieId:null,
      libelle: val("rpLib")||"Entrée ponctuelle", type:"revenu", origine:"manuel"
    });
    vide("rpLib"); vide("rpMt");
    majEtRendre("Entrée enregistrée");
  },

  suppTx: function(el){
    var id = el.getAttribute("data-id");
    S.transactions = S.transactions.filter(function(t){return t.id!==id;});
    majEtRendre("Ligne supprimée");
  },

  ajoutPortefeuille: function(){
    var nom = val("pfNom");
    if(!nom){ toast("Donnez un nom au portefeuille."); return; }
    var budget = nbTexte(val("pfBudget"));
    var existant = S.categories.filter(function(c){ return c.nom.toLowerCase()===nom.toLowerCase(); })[0];
    if(existant){
      // Le poste existe déjà : on lui attribue simplement son budget
      existant.budget = budget>0 ? budget : null;
      vide("pfNom"); vide("pfBudget");
      majEtRendre(budget>0 ? "Budget attribué à « "+existant.nom+" »" : "Ce poste existait déjà");
      return;
    }
    // Garde-fou : un poste très proche existe-t-il déjà ? On évite les doublons
    // du type « Cuisine » alors que « Cuisine & nourriture » est déjà là.
    var n = normalise(nom);
    var proche = S.categories.filter(function(c){
      var cn = normalise(c.nom);
      return cn.indexOf(n) === 0 || n.indexOf(cn) === 0;
    })[0];
    if(proche){
      var mtn = budget;
      confirmer("Un poste très proche existe déjà",
        "« "+proche.nom+" » est déjà dans votre liste. Voulez-vous lui donner ce budget plutôt que de créer un doublon ?",
        function(){
          proche.budget = mtn>0 ? mtn : null;
          vide("pfNom"); vide("pfBudget");
          majEtRendre("Budget attribué à « "+proche.nom+" »");
        },
        function(){
          S.categories.push({id: uid("c"), nom: nom, essentiel:false, budget: mtn>0 ? mtn : null});
          vide("pfNom"); vide("pfBudget");
          majEtRendre("Portefeuille créé");
        },
        "Utiliser « "+proche.nom+" »", "Créer quand même");
      return;
    }
    S.categories.push({id: uid("c"), nom: nom, essentiel:false, budget: budget>0 ? budget : null});
    vide("pfNom"); vide("pfBudget");
    majEtRendre("Portefeuille créé");
  },

  retirerBudget: function(el){
    var c = cat(el.getAttribute("data-id"));
    c.budget = null;
    majEtRendre("Budget retiré — le poste reste, sans plafond");
  },

  ajoutCat: function(){
    var nom = val("catNom");
    if(!nom){ toast("Nommez le poste."); return; }
    if(S.categories.some(function(c){ return c.nom.toLowerCase()===nom.toLowerCase(); })){
      toast("Ce poste existe déjà."); return;
    }
    S.categories.push({id: uid("c"), nom: nom, essentiel: val("catEss")==="1", budget:null});
    vide("catNom");
    majEtRendre("Poste créé");
  },

  suppCat: function(el){
    var id = el.getAttribute("data-id");
    S.categories = S.categories.filter(function(c){return c.id!==id;});
    majEtRendre("Poste supprimé");
  },

  basculeEssentiel: function(el){
    var c = cat(el.getAttribute("data-id"));
    c.essentiel = !c.essentiel;
    majEtRendre(c.essentiel ? "Poste marqué essentiel" : "Poste rendu compressible");
  },

  fixerRecurrence: function(el){
    var id = el.getAttribute("data-id"), mt = parseFloat(el.getAttribute("data-mt"));
    var c = cat(id);
    S.charges.push({
      id: uid("ch"), libelle: c.nom, montant: mt, categorieId: id,
      jour: 5, frequence:"mensuelle", moisAncre: S.moisActif, actif:true
    });
    majEtRendre("« "+c.nom+" » est maintenant une charge fixe");
  },

  ajoutProjet: function(){
    var nom = val("pNom"), rev = nb("pRev");
    if(!nom || rev<=0){ toast("Il faut un nom et un revenu attendu."); return; }
    S.projets.push({
      id: uid("p"), nom: nom, revenu: rev, probabilite: nb("pProb")||50,
      moisCible: val("pMois"), cout: nb("pCout")||0, statut:"actif", notes:""
    });
    vide("pNom"); vide("pRev"); vide("pCout");
    majEtRendre("Projet ajouté à la projection");
  },

  suppProjet: function(el){
    var id = el.getAttribute("data-id");
    S.projets = S.projets.filter(function(p){return p.id!==id;});
    majEtRendre("Projet retiré");
  },

  export: function(){
    var brut = JSON.stringify(S, null, 2);
    var blob = new Blob([brut], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "corridor-budget-" + aujourdhui() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast("Sauvegarde téléchargée");
  },

  import: function(){ $("fichierImport").click(); },

  reset: function(){
    confirmer("Tout effacer ?", "Charges, dépenses, revenus, projets : tout disparaît définitivement. Exportez d'abord si vous avez le moindre doute.", function(){
      S = etatVierge();
      majEtRendre("Données effacées");
    });
  },

  demo: function(){
    S = donneesExemple();
    majEtRendre("Exemple chargé — remplacez-le par vos vrais chiffres quand vous voulez");
  }
};

/* ---------- Confirmation ---------- */
function confirmer(titre, texte, suite, alternative, libelleOui, libelleAlt){
  var mo = $("modale");
  var boutons = '<button class="btn" data-act="fermerModale">Annuler</button>';

}

/* ---------- Rendu global ---------- */
function ouvrirVue(v){
  vueActive = v;
  Array.prototype.forEach.call(document.querySelectorAll(".onglet"), function(o){
    o.setAttribute("aria-selected", o.getAttribute("data-vue")===v ? "true" : "false");
  });
  Array.prototype.forEach.call(document.querySelectorAll(".vue"), function(s){
    s.classList.toggle("on", s.id === "vue-"+v);
  });
  rendre();
  try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){}
}

var RENDUS = {bord:vueBord, charges:vueCharges, depenses:vueDepenses, portefeuilles:vuePortefeuilles, revenus:vueRevenus, projets:vueProjets, analyse:vueAnalyse, reglages:vueReglages};

function rendre(){
  $("moisLabel").textContent = libelleMois(S.moisActif);
  // Les vues inactives sont vidées : sans cela, plusieurs formulaires portant les
  // mêmes identifiants coexistent dans la page et getElementById renvoie celui de
  // la vue masquée — ce qui faisait lire un champ vide au lieu du champ saisi.
  Array.prototype.forEach.call(document.querySelectorAll(".vue"), function(s){
    if(s.id !== "vue-"+vueActive && s.innerHTML !== "") s.innerHTML = "";
  });
  var el = $("vue-"+vueActive);
  if(el && RENDUS[vueActive]) el.innerHTML = RENDUS[vueActive]();
  var restantes = chargesRestantes(S.moisActif).length;
  var pip = $("pipCharges");
  if(pip){ pip.hidden = !restantes; pip.textContent = restantes; }
  // Pastille Portefeuilles : nombre de portefeuilles dépassés ou proches de l'être
  var pip2 = $("pipPortef");
  if(pip2){
    var T = totauxPortefeuilles(S.moisActif);
    var alertes = T.depasses + T.aSurveiller;
    pip2.hidden = !alertes;
    pip2.textContent = alertes;
  }
}
function majEtRendre(msg){
  sauvegarder();
  rendre();
  if(msg) toast(msg);
}

/* ---------- Événements ---------- */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var a = el.getAttribute("data-act");
  if(el.tagName === "INPUT") return;

});
document.addEventListener("change", function(e){
  var el = e.target;
  var a = el.getAttribute && el.getAttribute("data-act");
  if(a === "plafond" || a === "budgetPortef"){
    var c = cat(el.getAttribute("data-id"));

    sauvegarder(); rendre();
  }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && e.target.tagName === "INPUT"){
    var carte = e.target.closest(".carte, .vide, .modale-in");
    var bouton = carte && carte.querySelector(".btn.primaire[data-act]");

});

/* ---------- Initialisation ---------- */
/* ---------- Auto-complétion des libellés ---------- */
function normalise(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function libellesConnus(type){
  var freq = {};
  S.transactions.forEach(function(t){
    if(t.type!==type || !t.libelle) return;
    var k = t.libelle.trim();
    if(!k) return;
    freq[k] = (freq[k]||0) + 1;
  });
  return Object.keys(freq).sort(function(a,b){ return freq[b]-freq[a]; });
}
function afficherSuggestions(input){
  var boite = document.getElementById(input.id+"-sugg");
  if(!boite) return;
  var q = normalise(input.value);
  if(q.length < 2){ boite.classList.remove("on"); boite.innerHTML=""; return; }
  var type = input.getAttribute("data-auto")==="revenu" ? "revenu" : "depense";
  var options = libellesConnus(type).filter(function(l){ return normalise(l).indexOf(q)===0 && normalise(l)!==q; }).slice(0,5);
  if(!options.length){ boite.classList.remove("on"); boite.innerHTML=""; return; }
  boite.innerHTML = options.map(function(l){
    return '<button type="button" data-act="remplirSuggestion" data-cible="'+input.id+'" data-valeur="'+ech(l)+'">'+ech(l)+'</button>';
  }).join("");
  boite.classList.add("on");
}
A.remplirSuggestion = function(el){
  var champ = document.getElementById(el.getAttribute("data-cible"));
  if(champ){ champ.value = el.getAttribute("data-valeur"); }
  var boite = document.getElementById(el.getAttribute("data-cible")+"-sugg");
  if(boite){ boite.classList.remove("on"); boite.innerHTML=""; }
};

/* ---------- Redimensionnement des graphiques ---------- */
var minuteurResize = null;
window.addEventListener("resize", function(){
  clearTimeout(minuteurResize);
  minuteurResize = setTimeout(function(){ if(pretPourSauvegarde) rendre(); }, 220);
});

function brancher(){
  try{
    document.addEventListener("input", function(e){
      var t = e.target;
      if(t && t.getAttribute && t.getAttribute("data-auto")) afficherSuggestions(t);
      if(t && t.classList && t.classList.contains("num-champ")){
        // rien pendant la frappe : on ne reformate qu'à la sortie du champ (voir blur)
      }
    });
    document.addEventListener("focusout", function(e){
      var t = e.target;
      if(t && t.getAttribute && t.getAttribute("data-auto")){
        setTimeout(function(){
          var b = document.getElementById(t.id+"-sugg");
          if(b) b.classList.remove("on");
        }, 180); // laisse le temps au clic sur une suggestion d'être traité
      }
      if(t && t.classList && t.classList.contains("num-champ")){
        var v = nbTexte(t.value);
        t.value = v>0 ? fmt(v) : t.value.trim()==="" ? "" : t.value;
      }
    }, true);
  Array.prototype.forEach.call(document.querySelectorAll(".onglet"), function(o){
    o.addEventListener("click", function(){ ouvrirVue(o.getAttribute("data-vue")); });
  });
  $("moisPrec").addEventListener("click", function(){ S.moisActif = moisDecale(S.moisActif,-1); sauvegarder(); rendre(); });
  $("moisSuiv").addEventListener("click", function(){ S.moisActif = moisDecale(S.moisActif, 1); sauvegarder(); rendre(); });
  $("modale").addEventListener("click", function(e){ if(e.target.id === "modale") A.fermerModale(); });
  $("fab").addEventListener("click", function(){ A.ouvrirAjoutRapide(); });
  $("fichierImport").addEventListener("change", function(e){
    var f = e.target.files[0];
    if(!f) return;
    var lect = new FileReader();
    lect.onload = function(){
      try{
        var obj = JSON.parse(lect.result);
        if(!obj || !obj.categories) throw new Error("format");
        S = Object.assign(etatVierge(), obj);
        S.moisActif = moisCourantReel();
        majEtRendre("Sauvegarde restaurée");
      }catch(err){
        toast("Fichier illisible — vérifiez qu'il vient bien de Corridor.");
      }
    };
    lect.onerror = function(){ toast("Lecture du fichier impossible."); };
    lect.readAsText(f);
    e.target.value = "";
  });
  }catch(err){ console.warn("Branchement partiel", err); }
}

function demarrer(){
  brancher();
  $("etatSauve").textContent = "Chargement…";
  Stockage.lire().then(function(charge){
    if(charge && charge.categories){
      S = Object.assign(etatVierge(), charge);
      S.reglages = Object.assign(etatVierge().reglages, charge.reglages||{});
      migrerPortefeuilles();
    }
    S.moisActif = moisCourantReel();
    pretPourSauvegarde = true;
    $("etatSauve").textContent = "Enregistré · " + Stockage.mode;
    ouvrirVue("bord");
    verifierNouvelleVersion();
  }).catch(function(){
    pretPourSauvegarde = true;
    $("etatSauve").textContent = "Hors sauvegarde";
    toast("Sauvegarde indisponible ici — pensez à exporter vos données.");
    ouvrirVue("bord");
    verifierNouvelleVersion();
  });
}

/* ---------- Détection de nouvelle version sur GitHub Pages ----------
   Ne touche jamais aux données : compare juste la date de dernière
   modification du fichier servi par GitHub à celle vue la dernière fois.
   Si elles diffèrent, on propose un rechargement — jamais de suppression
   d'icône, jamais de perte de données. */
var CLE_VERSION = "corridor-derniere-version-vue";
function verifierNouvelleVersion(){
  if(typeof fetch !== "function") return;
  fetch(location.href, {method:"HEAD", cache:"no-store"}).then(function(rep){
    var marqueur = rep.headers.get("etag") || rep.headers.get("last-modified");
    if(!marqueur) return;
    var vu;
    try{ vu = localStorage.getItem(CLE_VERSION); }catch(e){ return; }
    try{ localStorage.setItem(CLE_VERSION, marqueur); }catch(e){}
    if(vu && vu !== marqueur) afficherBandeauMaj();
  }).catch(function(){ /* pas grave : simple confort, pas une donnée critique */ });
}
function afficherBandeauMaj(){
  if($("bandeauMaj")) return;
  var b = document.createElement("div");
  b.id = "bandeauMaj";
  b.innerHTML = '<span>Une nouvelle version de l\'app est disponible.</span>'
    + '<button class="btn primaire mini" id="btnActualiser">Actualiser</button>';
  $("entete").prepend(b);
  $("btnActualiser").addEventListener("click", function(){ location.reload(); });
}

/* ---------- Jeu de démonstration ---------- */
function donneesExemple(){
  var e = etatVierge();
  var m0 = moisCourantReel();
  e.soldeDepart = 650000;
  e.charges = [
    {id:"ch1", libelle:"Loyer", montant:85000, categorieId:"c-loyer", jour:5, frequence:"mensuelle", moisAncre:moisDecale(m0,-6), actif:true},
    {id:"ch2", libelle:"Électricité (CEET)", montant:22000, categorieId:"c-energie", jour:10, frequence:"mensuelle", moisAncre:moisDecale(m0,-6), actif:true},
    {id:"ch3", libelle:"Forfait internet + data", montant:25000, categorieId:"c-connexion", jour:3, frequence:"mensuelle", moisAncre:moisDecale(m0,-6), actif:true},
    {id:"ch4", libelle:"Scolarité", montant:120000, categorieId:"c-famille", jour:15, frequence:"trimestrielle", moisAncre:moisDecale(m0,-6), actif:true},
    {id:"ch5", libelle:"Abonnements outils (IA, hébergement)", montant:38000, categorieId:"c-outils", jour:1, frequence:"mensuelle", moisAncre:moisDecale(m0,-6), actif:true},
    {id:"ch6", libelle:"Soutien famille", montant:40000, categorieId:"c-famille", jour:28, frequence:"mensuelle", moisAncre:moisDecale(m0,-6), actif:true}
  ];
  e.revenusRecurrents = [
    {id:"r1", libelle:"Abonnements clients SaaS", montant:380000, jour:5, fiabilite:100, actif:true},
    {id:"r2", libelle:"Prestations récurrentes", montant:240000, jour:20, fiabilite:80, actif:true}
  ];
  e.projets = [
    {id:"p1", nom:"Lancement du produit B2B", revenu:900000, probabilite:50, moisCible:moisDecale(m0,2), cout:150000, statut:"actif", notes:"pilote signé"},
    {id:"p2", nom:"Contrat maintenance annuel", revenu:450000, probabilite:70, moisCible:moisDecale(m0,1), cout:0, statut:"actif", notes:""},
    {id:"p3", nom:"Vente de stock cosmétique", revenu:280000, probabilite:90, moisCible:m0, cout:60000, statut:"actif", notes:""}
  ];
  var profils = [
    ["c-nourriture", 95000, 0.18], ["c-transport", 42000, 0.30], ["c-loisirs", 26000, 0.55],
    ["c-sante", 15000, 0.70], ["c-divers", 30000, 0.40], ["c-outils", 18000, 0.35]
  ];
  var tx = [];
  for(var i=6;i>=0;i--){
    var mm = moisDecale(m0,-i);
    var jmax = joursDansMois(mm);
    if(i>0){
      e.charges.forEach(function(ch){
        if(!chargeDueSimple(ch, mm)) return;
        tx.push({id:uid("t"), date:mm+"-"+String(Math.min(jmax,ch.jour)).padStart(2,"0"), montant:ch.montant,
                 categorieId:ch.categorieId, libelle:ch.libelle, type:"depense", origine:"charge", refId:ch.id});
      });
      e.revenusRecurrents.forEach(function(r){
        tx.push({id:uid("t"), date:mm+"-"+String(Math.min(jmax,r.jour)).padStart(2,"0"),
                 montant: Math.round(r.montant*(0.9+Math.random()*0.25)/1000)*1000,
                 categorieId:null, libelle:r.libelle, type:"revenu", origine:"recurrent", refId:r.id});
      });
    }
    profils.forEach(function(p){
      var total = p[1]*(1 + (Math.random()-0.5)*2*p[2]) * (i===0 ? 0.55 : 1);
      var n = 3 + Math.floor(Math.random()*4);
      for(var k=0;k<n;k++){
        var jour = 1 + Math.floor(Math.random()*(i===0 ? Math.max(1,new Date().getDate()) : jmax));
        tx.push({id:uid("t"), date:mm+"-"+String(jour).padStart(2,"0"),
                 montant: Math.max(500, Math.round(total/n/500)*500),
                 categorieId:p[0], libelle:"", type:"depense", origine:"manuel"});
      }
    });
  }
  e.transactions = tx;
  e.moisActif = m0;
  return e;
}
function chargeDueSimple(ch, m){
  if(ch.frequence === "mensuelle") return true;
  var d1 = moisEnDate(ch.moisAncre), d2 = moisEnDate(m);
  var diff = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(diff<0) return false;
  return ch.frequence==="trimestrielle" ? diff%3===0 : diff%12===0;
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", demarrer);
else demarrer();

})();
