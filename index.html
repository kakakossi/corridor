<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corridor — pilotage budgétaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette — encre de nuit & laiton. Un seul accent chaud, deux hues fonctionnelles. */
  --bg:#12171C;
  --bg-deep:#0D1216;
  --surface:#181F26;
  --surface-2:#1E262E;
  --border:#28323B;
  --border-fort:#3A4752;
  --text:#ECE6DA;
  --muted:#96A2AC;
  --subtle:#5D6B77;
  --accent:#D6A85C;
  --accent-fort:#E9BC70;
  --vert:#4E9E86;
  --vert-sourd:#2C4A44;
  --rouge:#C4674B;
  --rouge-sourd:#4A302A;
  --bleu:#6E8FA8;

  --text-xs:.75rem; --text-sm:.8125rem; --text-base:.9375rem; --text-lg:1.0625rem;
  --text-xl:1.15rem; --text-2xl:1.375rem; --text-3xl:clamp(1.6rem,7vw,2rem);
  --tracking-tight:-.02em; --tracking-wide:.09em;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
  --space-6:22px; --space-8:28px; --space-10:36px; --space-12:44px; --space-16:56px;
  --radius-sm:6px; --radius:10px; --radius-lg:16px;

  --ease-out:cubic-bezier(.16,1,.3,1);
  --fast:120ms; --normal:200ms; --slow:380ms;

  --serif:'Fraunces',Georgia,serif;
  --sans:'Archivo',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --barre-haut: 58px;
  --barre-bas: calc(60px + env(safe-area-inset-bottom));
  --tap: 44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:var(--text-base);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--barre-bas) + var(--space-8));
  overscroll-behavior-y:none;
  min-height:100dvh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 40% at 50% -6%, rgba(214,168,92,.07), transparent 60%);
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Ossature ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 var(--space-4);position:relative;z-index:1}

header.top{
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg-deep),var(--bg));
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(8px);
  padding-top:env(safe-area-inset-top);
}
.top-in{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;min-height:var(--barre-haut)}
.marque{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.marque h1{font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:var(--tracking-tight)}
.marque span{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:var(--tracking-wide)}
.mois-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2px}
.mois-nav button{width:var(--tap);height:36px;color:var(--muted);border-radius:var(--radius-sm);font-size:1.1rem;display:grid;place-items:center;transition:color var(--fast),background var(--fast)}
.mois-nav button:active{color:var(--text);background:var(--surface-2)}
.mois-nav .courant{padding:0 var(--space-2);font-size:11.5px;font-weight:600;min-width:78px;text-align:center;line-height:1.15}
.sauve{display:none}
.pastille{width:6px;height:6px;border-radius:50%;background:var(--vert);transition:background var(--normal)}
.pastille.actif{background:var(--accent)}
@media(min-width:560px){
  .sauve{display:flex;font-size:var(--text-xs);color:var(--subtle);align-items:center;gap:6px}
  .mois-nav .courant{min-width:120px;font-size:var(--text-sm)}
}

/* ---------- Navigation : barre basse mobile, onglets hauts au delà ---------- */
nav.onglets{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:linear-gradient(0deg,var(--bg-deep),var(--bg));
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.onglets-in{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:0}
.onglets-in::-webkit-scrollbar{display:none}
.onglet{
  flex:1 0 auto;min-width:64px;height:60px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:var(--subtle);white-space:nowrap;position:relative;
  transition:color var(--fast);
}
.onglet .ic{font-size:16px;line-height:1;color:inherit;font-style:normal}
.onglet[aria-selected="true"]{color:var(--accent)}
.onglet .pip{position:absolute;top:6px;right:14px;min-width:16px;padding:0 4px;border-radius:9px;background:var(--accent);color:#12171C;font-size:10px;font-weight:700;text-align:center;line-height:16px}
@media(min-width:760px){
  nav.onglets{position:sticky;top:var(--barre-haut);bottom:auto;border-top:none;border-bottom:1px solid var(--border);padding-bottom:0}
  .onglets-in{gap:var(--space-1)}
  .onglet{flex:0 0 auto;flex-direction:row;height:auto;min-width:0;padding:var(--space-3) var(--space-4);font-size:var(--text-sm);border-bottom:2px solid transparent;gap:var(--space-2)}
  .onglet .ic{display:none}
  .onglet[aria-selected="true"]{border-bottom-color:var(--accent);font-weight:600}
  .onglet:hover{color:var(--text)}
  .onglet .pip{position:static;margin-left:6px;display:inline-block;line-height:16px}
  body{padding-bottom:var(--space-16)}
}

/* Bouton flottant d'ajout rapide */
#fab{
  position:fixed;right:var(--space-4);bottom:calc(var(--barre-bas) + var(--space-3));z-index:45;
  width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#12171C;font-size:28px;font-weight:400;line-height:1;
  display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.15);
  transition:transform var(--fast);
}
#fab:active{transform:scale(.93)}
@media(min-width:760px){ #fab{ bottom:var(--space-6) } }

main{padding-top:var(--space-6)}
section.vue{display:none}
section.vue.on{display:block;animation:apparait var(--slow) var(--ease-out) both}
@keyframes apparait{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d1{animation-delay:40ms}.d2{animation-delay:80ms}.d3{animation-delay:120ms}

/* ---------- Blocs ---------- */
.carte{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4)}
.carte + .carte{margin-top:var(--space-4)}
.titre-bloc{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.titre-bloc h2{font-family:var(--serif);font-size:var(--text-xl);font-weight:600;letter-spacing:var(--tracking-tight)}
.titre-bloc h3{font-size:var(--text-base);font-weight:600}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--subtle)}
.aide{font-size:var(--text-sm);color:var(--muted);line-height:1.6}
@media(min-width:640px){ .carte{padding:var(--space-6)} }

.grille{display:grid;gap:var(--space-3)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:1fr 1fr}
.g-asym{grid-template-columns:1fr}
@media(min-width:640px){ .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} }
@media(min-width:900px){ .g-asym{grid-template-columns:1.55fr 1fr;align-items:start} }
@media(max-width:400px){ .g2,.g3,.g4{grid-template-columns:1fr} }

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--subtle)}
.kpi .val{font-family:var(--mono);font-size:1.35rem;font-weight:600;letter-spacing:-.03em;line-height:1.2;word-break:break-word}
.kpi .sub{font-size:11px;color:var(--muted);line-height:1.4}
.kpi.majeur{background:linear-gradient(160deg,var(--surface-2),var(--surface));border-color:var(--border-fort);grid-column:1/-1}
.kpi.majeur .val{font-size:var(--text-3xl);color:var(--accent)}
.kpi.alerte .val{color:var(--rouge)}
.kpi.bien .val{color:var(--vert)}
@media(min-width:640px){ .kpi.majeur{grid-column:auto} }

/* Bandeau rappel */
.rappel{
  border:1px solid var(--accent);border-left-width:3px;background:linear-gradient(90deg,rgba(214,168,92,.10),rgba(214,168,92,.02));
  border-radius:var(--radius);padding:var(--space-4);margin-bottom:var(--space-4);
  display:flex;flex-direction:column;gap:var(--space-3)
}
.rappel.grave{border-color:var(--rouge);background:linear-gradient(90deg,rgba(196,103,75,.12),transparent)}
.rappel .txt{font-size:var(--text-sm);line-height:1.55}
.rappel strong{color:var(--accent-fort)}
.rappel.grave strong{color:var(--rouge)}
.rappel .btn{align-self:flex-start}
@media(min-width:560px){ .rappel{flex-direction:row;align-items:center} .rappel .txt{flex:1} }

/* Boutons — cibles tactiles ≥44px */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--tap);padding:var(--space-2) var(--space-4);border-radius:var(--radius);border:1px solid var(--border-fort);background:var(--surface-2);color:var(--text);font-size:var(--text-sm);font-weight:500;transition:background var(--fast),border-color var(--fast),transform var(--fast)}
.btn:active{transform:scale(.97);background:var(--border)}
.btn.primaire{background:var(--accent);border-color:var(--accent);color:#12171C;font-weight:600}
.btn.primaire:active{background:var(--accent-fort)}
.btn.discret{background:none;border-color:transparent;color:var(--muted);min-height:var(--tap);padding:0 var(--space-2)}
.btn.discret:active{color:var(--text);background:var(--surface-2)}
.btn.danger{color:var(--rouge)}
.btn.mini{min-height:36px;padding:0 var(--space-3);font-size:var(--text-xs)}
.btn.large{width:100%;min-height:52px;font-size:var(--text-base)}

/* Formulaires — une colonne par défaut, jamais de zoom iOS (16px min) */
.champ{display:flex;flex-direction:column;gap:6px;position:relative}
.champ label{font-size:10.5px;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--subtle)}
input,select,textarea{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px var(--space-3);width:100%;min-height:var(--tap);
  font-size:16px;transition:border-color var(--fast),background var(--fast)
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--bg)}
input.num-champ{font-family:var(--mono)}
input::placeholder{color:var(--subtle)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:var(--space-8)}
.ligne-form{display:grid;gap:var(--space-3);grid-template-columns:1fr}
@media(min-width:560px){ .ligne-form{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end} }

/* Auto-complétion */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface-2);border:1px solid var(--border-fort);border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.4);display:none}
.sugg.on{display:block}
.sugg button{display:block;width:100%;text-align:left;padding:11px var(--space-3);font-size:var(--text-sm);min-height:var(--tap)}
.sugg button:active{background:var(--surface)}
.sugg button+button{border-top:1px solid var(--border)}

/* Listes */
.liste{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.item:last-child{border-bottom:none}
.item .nom{flex:1;min-width:110px;font-size:var(--text-sm)}
.item .meta,.meta{font-size:11px;color:var(--subtle)}
.item .mt{font-family:var(--mono);font-size:var(--text-sm);font-weight:500}
.item.paye .nom{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--subtle)}

.coche{width:28px;height:28px;border:1.5px solid var(--border-fort);border-radius:var(--radius-sm);display:grid;place-items:center;flex:none;transition:all var(--fast);background:var(--bg-deep);min-height:0}
.coche.on{background:var(--vert);border-color:var(--vert)}
.coche.on::after{content:"";width:7px;height:12px;border:solid #12171C;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1.5px)}

.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;letter-spacing:.03em;border:1px solid var(--border-fort);color:var(--muted);white-space:nowrap}
.tag.or{border-color:var(--accent);color:var(--accent)}
.tag.vert{border-color:var(--vert);color:var(--vert)}
.tag.rouge{border-color:var(--rouge);color:var(--rouge)}

/* Barres de progression / enveloppes */
.jauge{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.jauge > i{display:block;height:100%;border-radius:3px;background:var(--vert);transition:width var(--slow) var(--ease-out)}
.jauge > i.attention{background:var(--accent)}
.jauge > i.depasse{background:var(--rouge)}

/* Portefeuilles */
.portef{padding:var(--space-4) 0;border-bottom:1px solid var(--border)}
.portef:last-child{border-bottom:none}
.portef-haut{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-2);flex-wrap:wrap}
.portef-nom{font-size:var(--text-base);font-weight:600;display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.portef-chiffres{font-size:var(--text-sm);white-space:nowrap}
.portef-bas{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-2);flex-wrap:wrap}
.portef-actions{display:flex;align-items:center;gap:var(--space-2);margin-left:auto}
.portef-champ{width:110px;min-height:38px;padding:6px var(--space-3);font-size:var(--text-sm)}
.item .portef-champ{flex:none}

/* Résumé compact des portefeuilles sur le tableau de bord */
.pf-mini{display:flex;flex-direction:column;gap:var(--space-3)}
.pf-mini-l{display:grid;grid-template-columns:1fr auto;gap:var(--space-1) var(--space-3);align-items:center}
.pf-mini-l .jauge{grid-column:1/-1}
.pf-mini-nom{font-size:var(--text-sm);display:flex;align-items:center;gap:var(--space-2);min-width:0}
.pf-mini-nom span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-mini-val{font-family:var(--mono);font-size:var(--text-sm);white-space:nowrap}

/* Conseils */
.conseil{display:flex;gap:var(--space-3);padding:var(--space-3);border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-deep);align-items:flex-start}
.conseil + .conseil{margin-top:var(--space-3)}
.conseil .pic{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.conseil.haute{border-color:var(--rouge-sourd)} .conseil.haute .pic{background:var(--rouge-sourd);color:var(--rouge)}
.conseil.moyenne .pic{background:rgba(214,168,92,.15);color:var(--accent)}
.conseil.bonne{border-color:var(--vert-sourd)} .conseil.bonne .pic{background:var(--vert-sourd);color:var(--vert)}
.conseil h4{font-size:var(--text-sm);font-weight:600;margin-bottom:2px;line-height:1.35}
.conseil p{font-size:var(--text-sm);color:var(--muted);line-height:1.55}

/* Vide */
.vide{text-align:center;padding:var(--space-8) var(--space-4);border:1px dashed var(--border-fort);border-radius:var(--radius-lg);color:var(--muted)}
.vide h3{font-family:var(--serif);font-size:var(--text-lg);color:var(--text);margin-bottom:var(--space-2)}
.vide p{font-size:var(--text-sm);max-width:420px;margin:0 auto var(--space-5)}
.vide .btn{width:100%;margin-top:var(--space-2)}
@media(min-width:480px){ .vide .btn{width:auto} }

/* Graphiques */
svg.graph{width:100%;height:auto;display:block;overflow:visible}
.legende{display:flex;gap:var(--space-3) var(--space-4);flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:var(--space-3)}
.legende i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* Score */
.score-anneau{display:flex;flex-direction:column;align-items:center;gap:var(--space-4)}
.score-detail{width:100%;display:flex;flex-direction:column;gap:var(--space-3)}
.score-l{display:grid;grid-template-columns:1fr auto;gap:var(--space-1) var(--space-3);font-size:var(--text-sm);align-items:center}
.score-l .jauge{grid-column:1/-1}
@media(min-width:560px){ .score-anneau{flex-direction:row;align-items:center} }

/* Modale : plein écran / fond de page sur mobile */
.modale{position:fixed;inset:0;background:rgba(8,11,14,.72);display:none;z-index:100;backdrop-filter:blur(3px)}
.modale.on{display:flex;align-items:flex-end;justify-content:center}
.modale-in{background:var(--surface);border:1px solid var(--border-fort);border-top-left-radius:var(--radius-lg);border-top-right-radius:var(--radius-lg);padding:var(--space-5);padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom));width:100%;max-height:88dvh;overflow:auto;animation:montee var(--normal) var(--ease-out) both}
@keyframes montee{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){
  .modale{align-items:center;padding:var(--space-4)}
  .modale-in{border-radius:var(--radius-lg);max-width:520px;animation:apparait var(--normal) var(--ease-out) both}
}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--barre-bas) + var(--space-3));transform:translate(-50%,140%);background:var(--surface-2);border:1px solid var(--border-fort);border-radius:var(--radius);padding:var(--space-3) var(--space-5);font-size:var(--text-sm);z-index:200;transition:transform var(--normal) var(--ease-out);box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}

/* Tableaux : cartes empilées sur mobile, tableau classique au-delà */
.tableau{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.tableau thead{display:none}
.tableau tr{display:block;padding:var(--space-3) 0;border-bottom:1px solid var(--border)}
.tableau tr:last-child{border-bottom:none}
.tableau td{display:flex;justify-content:space-between;gap:var(--space-3);padding:3px 0;border:none;text-align:right}
.tableau td::before{content:attr(data-label);color:var(--subtle);font-size:11px;text-align:left;text-transform:uppercase;letter-spacing:.05em}
.tableau td:first-child{font-weight:600;font-size:var(--text-base)}
.tableau td:first-child::before{content:""}
.tableau td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
@media(min-width:640px){
  .tableau thead{display:table-header-group}
  .tableau tr{display:table-row;padding:0;border-bottom:1px solid var(--border)}
  .tableau th{text-align:left;font-size:var(--text-xs);text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--subtle);padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border);font-weight:500}
  .tableau td{display:table-cell;padding:var(--space-3);text-align:left}
  .tableau td::before{display:none}
  .tableau td.n,.tableau th.n{text-align:right}
}
.scroll-x{overflow-x:auto}

#bandeauMaj{
  display:flex;align-items:center;justify-content:center;gap:var(--space-3);flex-wrap:wrap;

<script>
/* ============================================================
   CORRIDOR — pilotage budgétaire personnel
   Noyau : état, persistance, mathématiques
   ============================================================ */
(function(){
"use strict";

/* ---------- Constantes ---------- */
var CLE = "corridor-budget-v1";
var MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var ALPHA = 0.45;          // lissage exponentiel : poids du mois le plus récent
var FENETRE = 12;          // profondeur d'historique analysée (mois)
var SEUIL_ANOMALIE = 3.5;  // z-score robuste au-delà duquel une dépense est signalée

/* ---------- État par défaut ---------- */
function etatVierge(){
  return {
    version: 1,
    devise: "FCFA",
    moisActif: clefMois(new Date()),
    soldeDepart: 0,
    reglages: {
      tauxEpargne: 15,        // % des revenus à mettre de côté
      coussinMois: 3,         // objectif de coussin de sécurité en mois de besoin
      seuilRecurrence: 3,     // nb de mois avant de proposer de fixer une dépense
      alerteEnveloppe: 80,    // % d'une enveloppe avant alerte
      jourSalaire: 1
    },
    categories: [
      {id:"c-loyer", nom:"Logement", essentiel:true, budget:null},
      {id:"c-nourriture", nom:"Cuisine & nourriture", essentiel:true, budget:null},
      {id:"c-transport", nom:"Transport", essentiel:true, budget:null},
      {id:"c-sante", nom:"Santé", essentiel:true, budget:null},
      {id:"c-connexion", nom:"Internet & téléphone", essentiel:true, budget:null},
      {id:"c-energie", nom:"Électricité & eau", essentiel:true, budget:null},
      {id:"c-famille", nom:"Famille & obligations sociales", essentiel:true, budget:null},
      {id:"c-outils", nom:"Outils & abonnements pro", essentiel:false, budget:null},
      {id:"c-loisirs", nom:"Loisirs & sorties", essentiel:false, budget:null},
      {id:"c-divers", nom:"Divers", essentiel:false, budget:null}
    ],
    charges: [],            // {id,libelle,montant,categorieId,jour,frequence,moisAncre,actif}
    revenusRecurrents: [],  // {id,libelle,montant,jour,fiabilite,actif}
    transactions: [],       // {id,date,montant,categorieId,libelle,type,origine,refId}
    projets: [],            // {id,nom,revenu,probabilite,moisCible,cout,statut,notes}
    objectifs: [],          // {id,nom,cible,deja,echeance}
    journal: {}             // "2026-08": {noteFinMois:""}
  };
}

var S = etatVierge();
var vueActive = "bord";
var pretPourSauvegarde = false;

/* ---------- Utilitaires ---------- */
function uid(p){ return (p||"x") + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function clefMois(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function moisEnDate(m){ var p=m.split("-"); return new Date(+p[0], +p[1]-1, 1); }
function libelleMois(m){ var d=moisEnDate(m); return MOIS_FR[d.getMonth()] + " " + d.getFullYear(); }
function moisDecale(m,n){ var d=moisEnDate(m); d.setMonth(d.getMonth()+n); return clefMois(d); }
function joursDansMois(m){ var d=moisEnDate(m); return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }
function aujourdhui(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function moisCourantReel(){ return clefMois(new Date()); }
function estMoisEnCours(m){ return m === moisCourantReel(); }
function estFutur(m){ return m > moisCourantReel(); }

function fmt(n){
  n = Math.round(n||0);
  var neg = n<0; n = Math.abs(n);
  var s = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (neg?"−":"") + s;
}
function fmtD(n){ return fmt(n) + " " + S.devise; }
function pct(n){ return (Math.round(n*10)/10).toString().replace(".",",") + " %"; }
function ech(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
});}
/* Migration douce : les anciennes données parlaient de "plafond", on parle
   désormais de "budget" de portefeuille. Aucune donnée n'est perdue. */
function migrerPortefeuilles(){
  (S.categories||[]).forEach(function(c){
    if(c.budget === undefined || c.budget === null){
      if(c.plafond !== undefined && c.plafond !== null && c.plafond > 0) c.budget = c.plafond;
      else if(c.budget === undefined) c.budget = null;
    }
    delete c.plafond;
  });
}

function cat(id){
  var c = S.categories.filter(function(x){return x.id===id;})[0];
  return c || {id:id, nom:"Sans portefeuille", essentiel:false, budget:null};
}

/* ---------- Persistance (Claude storage → repli navigateur → mémoire) ---------- */
var Stockage = (function(){
  var interne = null;
  function dispo(){ return typeof window !== "undefined" && window.storage && typeof window.storage.get === "function"; }
  return {
    mode: "mémoire",
    lire: function(){
      if(dispo()){
        this.mode = "interne";
        return window.storage.get(CLE).then(function(r){
          return r && r.value ? JSON.parse(r.value) : null;
        }).catch(function(){ return null; });
      }
      try{
        if(typeof localStorage !== "undefined"){
          this.mode = "navigateur";
          var v = localStorage.getItem(CLE);
          return Promise.resolve(v ? JSON.parse(v) : null);
        }
      }catch(e){}
      return Promise.resolve(interne);
    },
    ecrire: function(obj){
      var brut = JSON.stringify(obj);
      interne = obj;
      if(dispo()) return window.storage.set(CLE, brut);
      try{
        if(typeof localStorage !== "undefined"){ localStorage.setItem(CLE, brut); return Promise.resolve(true); }
      }catch(e){ return Promise.reject(e); }
      return Promise.resolve(true);
    }
  };
})();

var minuteurSauve = null;
function sauvegarder(){
  if(!pretPourSauvegarde) return;
  var p = document.getElementById("pastille"), t = document.getElementById("etatSauve");
  if(p) p.classList.add("actif");
  if(t) t.textContent = "Enregistrement…";
  clearTimeout(minuteurSauve);
  minuteurSauve = setTimeout(function(){
    Stockage.ecrire(S).then(function(){
      if(p) p.classList.remove("actif");
      if(t) t.textContent = "Enregistré · " + Stockage.mode;
    }).catch(function(){
      if(t) t.textContent = "Échec de l'enregistrement";
      if(p) p.style.background = "var(--rouge)";
      toast("Sauvegarde impossible. Exportez vos données depuis Réglages.");
    });
  }, 400);
}

function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  el._afficheDepuis = Date.now();
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("on"); }, 2600);
}
// Filet de sécurité : sur iPhone, verrouiller l'écran ou changer d'app pendant
// qu'un toast s'affiche peut mettre en pause son minuteur — à cause de ça, le
// message peut rester figé jusqu'au retour. On revérifie à chaque retour au
// premier plan, et un tap sur le toast le referme aussi immédiatement.
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  var el = document.getElementById("toast");
  if(el && el.classList.contains("on") && el._afficheDepuis && Date.now()-el._afficheDepuis > 2600){
    el.classList.remove("on");
  }
});
function attacherFermetureToast(){
  var el = document.getElementById("toast");
  if(el) el.addEventListener("click", function(){ el.classList.remove("on"); });
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", attacherFermetureToast);
else attacherFermetureToast();

/* ============================================================
   MATHÉMATIQUES
   ============================================================ */

/* Moyenne mobile exponentielle : les mois récents pèsent plus lourd
   que les anciens — une hausse durable est détectée en 2 mois. */
function ewma(serie, alpha){
  if(!serie.length) return 0;
  alpha = alpha || ALPHA;
  var v = serie[0];
  for(var i=1;i<serie.length;i++) v = alpha*serie[i] + (1-alpha)*v;
  return v;
}
function somme(a){ return a.reduce(function(x,y){return x+y;},0); }
function moyenne(a){ return a.length ? somme(a)/a.length : 0; }
function trie(a){ return a.slice().sort(function(x,y){return x-y;}); }
function mediane(a){
  if(!a.length) return 0;
  var s = trie(a), m = Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}
function quantile(a,q){
  if(!a.length) return 0;
  var s = trie(a), pos = (s.length-1)*q, b = Math.floor(pos), r = pos-b;
  return s[b+1] !== undefined ? s[b] + r*(s[b+1]-s[b]) : s[b];
}
function ecartType(a){
  if(a.length<2) return 0;
  var m = moyenne(a);
  return Math.sqrt(somme(a.map(function(x){return (x-m)*(x-m);}))/(a.length-1));
}
/* Écart absolu médian : robuste, un mois exceptionnel ne fausse pas tout. */
function mad(a){
  if(!a.length) return 0;
  var m = mediane(a);
  return mediane(a.map(function(x){return Math.abs(x-m);}));
}
function coefVariation(a){ var m = moyenne(a); return m>0 ? ecartType(a)/m : 0; }

/* Régression linéaire par moindres carrés → pente mensuelle et qualité (R²). */
function regression(ys){
  var n = ys.length;
  if(n<2) return {pente:0, ord: n?ys[0]:0, r2:0};
  var xs = ys.map(function(_,i){return i;});
  var mx = moyenne(xs), my = moyenne(ys), num=0, den=0;
  for(var i=0;i<n;i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  var pente = den ? num/den : 0, ord = my - pente*mx;
  var sr=0, st=0;
  for(var j=0;j<n;j++){ var pred = ord+pente*j; sr += (ys[j]-pred)*(ys[j]-pred); st += (ys[j]-my)*(ys[j]-my); }
  return {pente:pente, ord:ord, r2: st ? Math.max(0, 1-sr/st) : 0};
}

/* ============================================================
   LECTURE DE L'ÉTAT — sélecteurs
   ============================================================ */

function txMois(m, filtre){
  return S.transactions.filter(function(t){
    if(t.date.slice(0,7) !== m) return false;
    if(filtre === "depense") return t.type === "depense";
    if(filtre === "revenu") return t.type === "revenu";
    if(filtre === "variable") return t.type === "depense" && t.origine === "manuel";
    return true;
  });
}

/* Une charge est-elle due ce mois-ci ? (mensuel / trimestriel / annuel) */
function chargeDue(ch, m){
  if(!ch.actif) return false;
  if(ch.moisAncre && m < ch.moisAncre) return false;
  if(ch.frequence === "mensuelle") return true;
  var ancre = ch.moisAncre || m;
  var d1 = moisEnDate(ancre), d2 = moisEnDate(m);
  var diff = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(diff < 0) return false;
  if(ch.frequence === "trimestrielle") return diff % 3 === 0;
  if(ch.frequence === "annuelle") return diff % 12 === 0;
  return true;
}
function chargesDuMois(m){ return S.charges.filter(function(c){ return chargeDue(c,m); }); }
function chargePayee(m, id){
  return S.transactions.some(function(t){ return t.origine==="charge" && t.refId===id && t.date.slice(0,7)===m; });
}
function revenuEncaisse(m, id){
  return S.transactions.some(function(t){ return t.origine==="recurrent" && t.refId===id && t.date.slice(0,7)===m; });
}

function totalChargesMois(m){ return somme(chargesDuMois(m).map(function(c){return c.montant;})); }
function chargesRestantes(m){
  return chargesDuMois(m).filter(function(c){ return !chargePayee(m,c.id); });
}
function totalVariablesMois(m){ return somme(txMois(m,"variable").map(function(t){return t.montant;})); }
function totalDepensesMois(m){ return somme(txMois(m,"depense").map(function(t){return t.montant;})); }
function totalRevenusEncaisses(m){ return somme(txMois(m,"revenu").map(function(t){return t.montant;})); }
function revenusAttendus(m){
  var restants = S.revenusRecurrents.filter(function(r){ return r.actif && !revenuEncaisse(m,r.id); });
  return somme(restants.map(function(r){ return r.montant; }));
}
function revenuTotalPrevu(m){ return totalRevenusEncaisses(m) + revenusAttendus(m); }

/* Mois disposant de données réelles, du plus ancien au plus récent. */
function moisAvecDonnees(){
  var set = {};
  S.transactions.forEach(function(t){ set[t.date.slice(0,7)] = true; });
  return Object.keys(set).sort();
}
function historique(m, n){
  var out = [];
  for(var i=n;i>=1;i--) out.push(moisDecale(m,-i));
  return out;
}

/* ============================================================
   LE CORRIDOR — combien il faut, réellement, pour tenir le mois
   ============================================================ */
function corridor(m){
  var passes = historique(m, FENETRE).filter(function(x){ return moisAvecDonnees().indexOf(x) >= 0; });
  var serieVar = passes.map(totalVariablesMois).filter(function(v){ return v>0; });
  var n = serieVar.length;
  var fixe = totalChargesMois(m);

  var plancher, central, confort, fiabilite;
  if(n === 0){
    var estimeVar = totalVariablesMois(m);
    plancher = fixe + estimeVar; central = fixe + estimeVar; confort = fixe + estimeVar*1.2;
    fiabilite = "aucune";
  } else if(n < 3){
    var e = ewma(serieVar);
    plancher = fixe + e*0.85; central = fixe + e; confort = fixe + e*1.25;
    fiabilite = "faible";
  } else {
    var e2 = ewma(serieVar);
    var med = mediane(serieVar);
    var base = (e2*0.6 + med*0.4);            // mélange tendance récente / valeur typique
    plancher = fixe + Math.min(quantile(serieVar,0.25), base);
    central  = fixe + base;
    confort  = fixe + Math.max(quantile(serieVar,0.75), base + mad(serieVar)*1.4826);
    fiabilite = n >= 6 ? "élevée" : "moyenne";
  }
  var epargne = revenuTotalPrevu(m) * (S.reglages.tauxEpargne/100);
  return {
    fixe: fixe, plancher: plancher, central: central, confort: confort,
    epargneCible: epargne, cibleTotale: central + epargne,
    nMois: n, fiabilite: fiabilite, serie: serieVar
  };
}

/* Reste à vivre par jour — recalculé selon les jours restants du mois. */
function resteAVivre(m){
  var c = corridor(m);
  var revenu = revenuTotalPrevu(m);
  var fixeRestant = somme(chargesRestantes(m).map(function(x){return x.montant;}));
  var fixePaye = c.fixe - fixeRestant;
  var varDejaFait = totalVariablesMois(m);
  var dispo = revenu - c.fixe - c.epargneCible - varDejaFait;

  var jours = joursDansMois(m), jour = estMoisEnCours(m) ? new Date().getDate() : (estFutur(m) ? 1 : jours);
  var restants = Math.max(1, jours - jour + 1);
  return {
    disponible: dispo, parJour: dispo/restants, joursRestants: restants,
    fixeRestant: fixeRestant, fixePaye: fixePaye, revenu: revenu,
    varDejaFait: varDejaFait, tauxEcoulement: jours ? (jour/jours) : 0
  };
}

/* Atterrissage de fin de mois. En début de mois on fait confiance à la prévision
   statistique, en fin de mois au rythme réellement constaté ; entre les deux, un
   mélange pondéré par l'avancement du mois. */
function atterrissage(m){
  var c = corridor(m), r = resteAVivre(m);
  var varAttendu = Math.max(0, c.central - c.fixe);
  var t = estMoisEnCours(m) ? Math.min(1, Math.max(0.05, r.tauxEcoulement)) : 1;
  var extrapole = r.varDejaFait / t;
  var varFin = estFutur(m) ? varAttendu
             : (estMoisEnCours(m) ? t*extrapole + (1-t)*Math.max(varAttendu, r.varDejaFait) : r.varDejaFait);
  var depense = c.fixe + varFin;
  return {varFin:varFin, depense:depense, epargne: r.revenu - depense, ecart: depense - c.central};
}

/* Prévision par catégorie : ce que chaque poste devrait coûter le mois prochain. */
function previsionsCategories(m){
  var passes = historique(m, FENETRE);
  return S.categories.map(function(c){
    var serie = passes.map(function(mm){
      return somme(txMois(mm,"variable").filter(function(t){return t.categorieId===c.id;}).map(function(t){return t.montant;}));
    });
    var actifs = serie.filter(function(v){return v>0;});
    var moisPresents = actifs.length;
    var prevu = moisPresents ? ewma(serie.slice(-Math.min(6,serie.length))) : 0;
    var cv = coefVariation(actifs);
    return {
      cat: c,
      serie: serie,
      moisPresents: moisPresents,
      prevu: prevu,
      typique: mediane(actifs),
      cv: cv,
      stabilite: moisPresents<2 ? "inconnue" : (cv<0.2 ? "stable" : cv<0.5 ? "irrégulier" : "imprévisible"),
      reel: somme(txMois(m,"variable").filter(function(t){return t.categorieId===c.id;}).map(function(t){return t.montant;})),
      tendance: regression(serie.slice(-6)).pente
    };
  }).filter(function(p){ return p.moisPresents>0 || p.reel>0; })
    .sort(function(a,b){ return (b.reel||b.prevu) - (a.reel||a.prevu); });
}

/* ---------- Portefeuilles ----------
   Un portefeuille = un poste de dépense doté d'un budget mensuel.
   Budget flexible : réajustable à tout moment, l'app propose un montant
   fondé sur vos habitudes mais ne l'impose jamais. */
function etatPortefeuilles(m){
  var prev = previsionsCategories(m);
  var parId = {};
  prev.forEach(function(p){ parId[p.cat.id] = p; });

  var totalJours = joursDansMois(m);
  var jourAuj = estMoisEnCours(m) ? new Date().getDate() : (estFutur(m) ? 0 : totalJours);
  var avancement = Math.min(1, jourAuj/totalJours);

  return S.categories.map(function(c){
    var p = parId[c.id];
    var depense = somme(txMois(m,"variable").filter(function(t){ return t.categorieId===c.id; })
                          .map(function(t){ return t.montant; }));
    var budget = (c.budget && c.budget>0) ? c.budget : null;
    var suggere = p && p.prevu ? Math.round(p.prevu*1.1/1000)*1000 : 0;
    var restant = budget ? budget - depense : null;
    var part = budget ? (depense/budget*100) : null;

    // Rythme : à ce stade du mois, où devrait-on être si on lissait le budget ?
    var attenduAujourdhui = budget ? budget*avancement : null;
    var avance = (budget && attenduAujourdhui>0) ? depense - attenduAujourdhui : null;

    // Projection fin de mois au rythme actuel
    var projete = (budget && avancement>0.15) ? depense/avancement : null;

    var statut = "sansBudget";
    if(budget){
      if(part >= 100) statut = "depasse";
      else if(part >= S.reglages.alerteEnveloppe) statut = "attention";
      else if(projete && projete > budget*1.05) statut = "risque";
      else statut = "ok";
    }
    return {
      cat:c, budget:budget, depense:depense, restant:restant, part:part,
      suggere:suggere, statut:statut, projete:projete, avance:avance,
      nbTx: txMois(m,"variable").filter(function(t){ return t.categorieId===c.id; }).length,
      prevu: p ? p.prevu : 0, typique: p ? p.typique : 0
    };
  });
}

/* Ceux qui ont réellement un budget défini, triés par urgence puis par poids */
function portefeuillesActifs(m){
  var rang = {depasse:0, attention:1, risque:2, ok:3};
  return etatPortefeuilles(m).filter(function(p){ return p.budget; })
    .sort(function(a,b){
      if(rang[a.statut] !== rang[b.statut]) return rang[a.statut]-rang[b.statut];
      return b.part - a.part;
    });
}

function totauxPortefeuilles(m){
  var actifs = portefeuillesActifs(m);
  var budget = somme(actifs.map(function(p){ return p.budget; }));
  var depense = somme(actifs.map(function(p){ return p.depense; }));
  // Dépenses variables qui ne sont rattachées à aucun portefeuille budgété
  var idsBudgetes = {};
  actifs.forEach(function(p){ idsBudgetes[p.cat.id] = true; });
  var horsPortefeuille = somme(txMois(m,"variable")
    .filter(function(t){ return !idsBudgetes[t.categorieId]; })
    .map(function(t){ return t.montant; }));
  return {
    nb: actifs.length, budget: budget, depense: depense,
    restant: budget - depense,
    part: budget ? depense/budget*100 : 0,
    horsPortefeuille: horsPortefeuille,
    depasses: actifs.filter(function(p){ return p.statut==="depasse"; }).length,
    aSurveiller: actifs.filter(function(p){ return p.statut==="attention" || p.statut==="risque"; }).length
  };
}

function couleurStatut(s){
  return s==="depasse" ? "var(--rouge)" : (s==="attention"||s==="risque") ? "var(--accent)" : "var(--vert)";
}
function classeJauge(s){
  return s==="depasse" ? "depasse" : (s==="attention"||s==="risque") ? "attention" : "";
}

/* Dépenses hors norme : |x − médiane| / (1,4826 × MAD) > seuil */
function anomalies(m){
  var passes = historique(m, 6).concat([m]);
  var parCat = {};
  passes.forEach(function(mm){
    txMois(mm,"variable").forEach(function(t){
      (parCat[t.categorieId] = parCat[t.categorieId] || []).push(t);
    });
  });
  var out = [];
  Object.keys(parCat).forEach(function(id){
    var lot = parCat[id], montants = lot.map(function(t){return t.montant;});
    if(lot.length < 5) return;
    var med = mediane(montants), sigma = 1.4826*mad(montants);
    if(sigma <= 0) return;
    lot.filter(function(t){ return t.date.slice(0,7)===m; }).forEach(function(t){
      var z = Math.abs(t.montant-med)/sigma;
      if(z > SEUIL_ANOMALIE && t.montant > med*1.5) out.push({tx:t, z:z, med:med});
    });
  });
  return out.sort(function(a,b){return b.z-a.z;}).slice(0,4);
}

/* Détection de récurrence : un poste variable qui revient chaque mois
   avec un montant stable mérite de devenir une charge fixe. */
function recurrencesDetectees(m){
  var passes = historique(m, 4).concat([m]);
  var out = [];
  S.categories.forEach(function(c){
    if(S.charges.some(function(ch){ return ch.actif && ch.categorieId===c.id; })) return;
    var parMois = passes.map(function(mm){
      return somme(txMois(mm,"variable").filter(function(t){return t.categorieId===c.id;}).map(function(t){return t.montant;}));
    });
    var presents = parMois.filter(function(v){return v>0;});
    if(presents.length < S.reglages.seuilRecurrence) return;
    var cv = coefVariation(presents);
    if(cv > 0.45) return;
    out.push({cat:c, montant: Math.round(mediane(presents)/500)*500, mois:presents.length, cv:cv});
  });
  return out;
}

/* Loi de Pareto : quelles catégories font 80 % de la dépense variable ? */
function pareto(m){
  var passes = historique(m,3).concat([m]);
  var tot = {};
  passes.forEach(function(mm){
    txMois(mm,"variable").forEach(function(t){ tot[t.categorieId] = (tot[t.categorieId]||0)+t.montant; });
  });
  var lignes = Object.keys(tot).map(function(id){ return {cat:cat(id), montant:tot[id]}; })
                     .sort(function(a,b){return b.montant-a.montant;});
  var total = somme(lignes.map(function(l){return l.montant;}));
  var cum = 0, vital = [];
  lignes.forEach(function(l){
    if(cum/total < 0.8){ vital.push(l); cum += l.montant; }
  });
  return {total:total, lignes:lignes, vital:vital, partVital: total ? cum/total : 0};
}

/* Coussin de sécurité et autonomie */
function tresorerie(m){
  var mois = moisAvecDonnees().filter(function(x){ return x <= m; });
  var solde = S.soldeDepart;
  mois.forEach(function(mm){ solde += totalRevenusEncaisses(mm) - totalDepensesMois(mm); });
  var besoin = corridor(m).central;
  return {solde:solde, autonomie: besoin>0 ? solde/besoin : 0, besoin:besoin};
}

/* Valeur espérée des projets : revenu × probabilité, par mois. */
function projetsParMois(m, n){
  var out = [];
  for(var i=0;i<n;i++){
    var mm = moisDecale(m,i);
    var lot = S.projets.filter(function(p){ return p.statut!=="abandonne" && p.moisCible===mm; });
    out.push({
      mois: mm,
      pessimiste: 0,
      attendu: somme(lot.map(function(p){ return p.revenu*(p.probabilite/100); })),
      optimiste: somme(lot.map(function(p){ return p.revenu; })),
      cout: somme(lot.map(function(p){ return p.cout||0; })),
      projets: lot
    });
  }
  return out;
}

/* Projection de trésorerie sur 6 mois, 3 scénarios. */
function projection(m, n){
  var t = tresorerie(m).solde;
  var recurrent = somme(S.revenusRecurrents.filter(function(r){return r.actif;}).map(function(r){return r.montant*(r.fiabilite||100)/100;}));
  var tendanceRev = regression(historique(m,6).map(totalRevenusEncaisses)).pente;
  var proj = projetsParMois(m, n);
  var scen = {pessimiste:[t], attendu:[t], optimiste:[t]};
  var etiquettes = [m];
  var a=t, b=t, c=t;
  for(var i=0;i<n;i++){
    var mm = moisDecale(m,i+1);
    var besoin = corridor(m).central;
    var revBase = recurrent + Math.max(0, tendanceRev*(i+1));
    a += revBase*0.85 - corridor(m).confort;
    b += revBase + proj[i].attendu - besoin - (proj[i].cout||0);
    c += revBase*1.05 + proj[i].optimiste - corridor(m).plancher - (proj[i].cout||0);
    scen.pessimiste.push(a); scen.attendu.push(b); scen.optimiste.push(c);
    etiquettes.push(mm);
  }
  return {scen:scen, mois:etiquettes};
}

/* Score de santé financière — 5 composantes explicables, 0 à 100. */
function scoreSante(m){
  var c = corridor(m), r = resteAVivre(m), tr = tresorerie(m);
  var revenu = r.revenu;

  // 1. Taux d'épargne réel (30 pts)
  var epargneReelle = revenu - totalDepensesMois(m);
  var taux = revenu>0 ? epargneReelle/revenu : 0;
  var p1 = Math.max(0, Math.min(30, (taux/0.20)*30));

  // 2. Couverture des charges fixes par les revenus (25 pts)
  var ratioFixe = revenu>0 ? c.fixe/revenu : 1;
  var p2 = ratioFixe<=0.35 ? 25 : ratioFixe>=0.75 ? 0 : 25*(0.75-ratioFixe)/0.40;

  // 3. Régularité des dépenses (15 pts)
  var cv = c.serie.length>2 ? coefVariation(c.serie) : 0.35;
  var p3 = Math.max(0, Math.min(15, 15*(1 - cv/0.6)));

  // 4. Coussin de sécurité (20 pts)
  var p4 = Math.max(0, Math.min(20, (tr.autonomie/S.reglages.coussinMois)*20));

  // 5. Discipline de paiement des charges (10 pts)
  var dues = chargesDuMois(m).length;
  var payees = dues - chargesRestantes(m).length;
  var avancement = estMoisEnCours(m) ? r.tauxEcoulement : 1;
  var p5 = dues===0 ? 10 : Math.max(0, Math.min(10, (payees/dues) / Math.max(0.15, avancement) * 10));

  var total = Math.round(p1+p2+p3+p4+p5);
  return {
    total: Math.max(0, Math.min(100, total)),
    parties: [
      {nom:"Taux d'épargne", val:p1, max:30, detail: revenu>0 ? pct(taux*100)+" du revenu conservé" : "aucun revenu saisi"},
      {nom:"Poids des charges fixes", val:p2, max:25, detail: revenu>0 ? pct(ratioFixe*100)+" du revenu part en charges" : "—"},
      {nom:"Régularité des dépenses", val:p3, max:15, detail:"variation de "+pct(cv*100)+" d'un mois à l'autre"},
      {nom:"Coussin de sécurité", val:p4, max:20, detail: (Math.round(tr.autonomie*10)/10).toString().replace(".",",")+" mois d'autonomie"},
      {nom:"Charges payées à temps", val:p5, max:10, detail: payees+" charge(s) réglée(s) sur "+dues}
    ]
  };
}

/* ============================================================
   CONSEILS — moteur de règles alimenté par les statistiques
   ============================================================ */
function conseils(m){
  var out = [];
  var c = corridor(m), r = resteAVivre(m), tr = tresorerie(m), sc = scoreSante(m);
  var revenu = r.revenu;

  var restantes = chargesRestantes(m);
  if(restantes.length && revenu > 0){
    var mt = somme(restantes.map(function(x){return x.montant;}));
    out.push({p:"haute", i:"!", t:"Provisionnez d'abord vos charges",
      d:"Il reste "+fmtD(mt)+" de charges obligatoires à régler ce mois. Mettez cette somme de côté avant toute autre dépense — c'est la seule partie de votre budget qui n'est pas négociable."});
  }

  // Portefeuilles en difficulté
  var pfAlerte = portefeuillesActifs(m).filter(function(p){
    return p.statut==="depasse" || p.statut==="attention" || p.statut==="risque";
  });
  if(pfAlerte.length){
    var depasses = pfAlerte.filter(function(p){ return p.statut==="depasse"; });
    if(depasses.length){
      var noms = depasses.slice(0,3).map(function(p){ return p.cat.nom; }).join(", ");
      var exces = somme(depasses.map(function(p){ return Math.abs(p.restant); }));
      out.push({p:"haute", i:"◈", t:(depasses.length>1?"Des portefeuilles sont dépassés":"Un portefeuille est dépassé"),
        d:noms+" : "+fmtD(exces)+" au-delà du budget prévu. Soit vous freinez sur ce poste jusqu'à la fin du mois, soit le budget était trop serré — dans ce cas réajustez-le, c'est fait pour."});
    } else {
      var proches = pfAlerte.slice(0,3).map(function(p){ return p.cat.nom+" ("+pct(p.part)+")"; }).join(", ");
      out.push({p:"moyenne", i:"◈", t:"Portefeuilles à surveiller",
        d:proches+". Vous n'avez pas encore dépassé, mais au rythme actuel la fin du mois sera juste sur ces postes."});
    }
  }

  if(revenu > 0 && c.central > revenu){
    out.push({p:"haute", i:"↓", t:"Votre train de vie dépasse vos revenus",
      d:"Vos besoins habituels tournent autour de "+fmtD(c.central)+" alors que vous attendez "+fmtD(revenu)+" ce mois. Il manque "+fmtD(c.central-revenu)+". Regardez l'onglet Analyse : deux ou trois postes concentrent presque toute la marge de manœuvre."});
  }

  if(r.disponible < 0){
    out.push({p:"haute", i:"×", t:"Le mois est déjà en dépassement",
      d:"Après charges et épargne cible, vous êtes à "+fmtD(r.disponible)+". Soit vous réduisez le variable jusqu'au "+joursDansMois(m)+", soit vous acceptez de rogner l'épargne de ce mois — mais décidez-le consciemment plutôt que de le subir."});
  } else if(r.disponible >= 0 && estMoisEnCours(m)){
    out.push({p:"moyenne", i:"→", t:"Votre rythme tenable aujourd'hui",
      d:"Il vous reste "+fmtD(r.disponible)+" de dépenses libres sur "+r.joursRestants+" jour(s), soit "+fmtD(r.parJour)+" par jour. Ce chiffre se recalcule à chaque dépense saisie."});
  }

  var at = atterrissage(m);
  if(estMoisEnCours(m) && r.tauxEcoulement > 0.2 && at.ecart > c.central*0.08){
    out.push({p:"haute", i:"◑", t:"Au rythme actuel, le mois finira à "+fmtD(at.depense),
      d:"C'est "+fmtD(at.ecart)+" de plus qu'un mois normal chez vous. Il reste "+r.joursRestants+" jour(s) : ramener le rythme à "+fmtD(Math.max(0,r.parJour))+" par jour suffit à revenir dans le corridor."});
  } else if(estMoisEnCours(m) && r.tauxEcoulement > 0.35 && at.ecart < -c.central*0.08){
    out.push({p:"bonne", i:"◐", t:"Mois plus léger que d'habitude",
      d:"À ce rythme vous finirez à "+fmtD(at.depense)+", soit "+fmtD(-at.ecart)+" sous votre besoin typique. Si ça tient, virez cet écart sur votre épargne dès maintenant plutôt qu'en fin de mois."});
  }

  var rec = recurrencesDetectees(m);
  rec.slice(0,2).forEach(function(x){
    out.push({p:"moyenne", i:"↻", t:"« "+x.cat.nom+" » revient chaque mois",
      d:"Ce poste apparaît "+x.mois+" mois de suite pour environ "+fmtD(x.montant)+", avec peu de variation. Passez-le en charge fixe : il sortira du budget imprévisible et entrera dans le socle que vous provisionnez d'avance."});
  });

  var an = anomalies(m);
  an.slice(0,2).forEach(function(x){
    out.push({p:"moyenne", i:"⚠", t:"Dépense inhabituelle en "+cat(x.tx.categorieId).nom,
      d:"« "+(x.tx.libelle||"sans libellé")+" » à "+fmtD(x.tx.montant)+" alors que vos dépenses de ce poste tournent autour de "+fmtD(x.med)+". Si c'est exceptionnel, tant mieux ; si ça se répète, votre budget de ce poste est sous-évalué."});
  });

  var pv = previsionsCategories(m);
  var monte = pv.filter(function(p){ return p.moisPresents>=3 && p.tendance > p.typique*0.12; })[0];
  if(monte){
    out.push({p:"moyenne", i:"↑", t:"« "+monte.cat.nom+" » dérive vers le haut",
      d:"Ce poste augmente d'environ "+fmtD(monte.tendance)+" par mois depuis six mois. Au rythme actuel, il coûtera "+fmtD(monte.prevu+monte.tendance*3)+" dans trois mois contre "+fmtD(monte.typique)+" habituellement."});
  }

  var volatile = pv.filter(function(p){ return p.moisPresents>=3 && p.cv>0.6 && p.prevu>0; })[0];
  if(volatile){
    out.push({p:"moyenne", i:"~", t:"« "+volatile.cat.nom+" » est imprévisible",
      d:"Ce poste varie de "+pct(volatile.cv*100)+" d'un mois à l'autre — c'est lui qui casse vos prévisions. Fixez-lui une enveloppe à "+fmtD(Math.round(volatile.prevu*1.1/1000)*1000)+" dans l'onglet Dépenses ; une limite visible suffit souvent à la tenir."});
  }

  if(tr.autonomie < 1 && c.central>0){
    out.push({p:"haute", i:"◇", t:"Aucun coussin de sécurité",
      d:"Votre trésorerie couvre moins d'un mois de besoins. Avant d'investir dans un projet, visez d'abord "+fmtD(c.central)+" d'avance — un mois entier. C'est ce qui vous évitera d'arrêter un projet en cours faute de liquidités."});
  } else if(tr.autonomie >= S.reglages.coussinMois){
    out.push({p:"bonne", i:"✓", t:"Coussin de sécurité atteint",
      d:"Vous tenez "+(Math.round(tr.autonomie*10)/10).toString().replace(".",",")+" mois sans aucun revenu. Au-delà de votre objectif de "+S.reglages.coussinMois+" mois, l'argent supplémentaire travaille mieux dans un projet que sur un compte."});
  }

  var pa = pareto(m);
  if(pa.vital.length && pa.total>0){
    out.push({p:"moyenne", i:"%", t:pa.vital.length+" poste(s) = "+pct(pa.partVital*100)+" de vos dépenses variables",
      d:"Sur les trois derniers mois : "+pa.vital.map(function(l){return l.cat.nom;}).join(", ")+". Toute économie sérieuse se joue là — pas sur les petits postes."});
  }

  if(S.projets.length){
    var pm = projetsParMois(m,6);
    var esp = somme(pm.map(function(x){return x.attendu;}));
    if(esp>0) out.push({p:"moyenne", i:"◦", t:"Vos projets valent "+fmtD(esp)+" en espérance sur 6 mois",
      d:"C'est la somme des revenus pondérés par leur probabilité, pas le total optimiste. Construisez votre budget sur ce chiffre, jamais sur le scénario où tout aboutit."});
  }

  if(sc.total>=75) out.push({p:"bonne", i:"★", t:"Situation saine",
      d:"Score de "+sc.total+"/100. Les fondamentaux tiennent : gardez la même discipline de saisie, c'est elle qui rend les prévisions fiables."});

  if(c.nMois < 3) out.push({p:"moyenne", i:"◔", t:"Les prévisions se précisent avec le temps",
      d:"Vous avez "+c.nMois+" mois d'historique exploitable. À partir de trois mois, le corridor devient statistiquement fiable ; à six, la saisonnalité apparaît. Saisissez tout, même les petites dépenses."});

  var ordre = {haute:0, moyenne:1, bonne:2};
  return out.sort(function(a,b){ return ordre[a.p]-ordre[b.p]; });
}
/* ============================================================
   GRAPHIQUES — SVG généré à la main, aucune dépendance
   ============================================================ */

function ligne(pts){ return pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" "); }

/* LE CORRIDOR : dépense cumulée du mois contre la trajectoire tenable.
   Rester dans la bande = finir le mois sans casse. */
function largeurGraph(){
  var w = (typeof window!=="undefined" && window.innerWidth) ? window.innerWidth : 400;
  return Math.max(300, Math.min(680, w - 88));
}

function svgCorridor(m){
  var W=largeurGraph(), estroit = W<460, H=estroit?230:250, gG=6, gD=estroit?72:118, gH=16, gB=estroit?34:40;
  var jours = joursDansMois(m);
  var c = corridor(m);
  var parJour = {};
  txMois(m,"depense").forEach(function(t){ var j=+t.date.slice(8,10); parJour[j]=(parJour[j]||0)+t.montant; });
  var cum=[], acc=0;
  for(var j=1;j<=jours;j++){ acc += parJour[j]||0; cum.push(acc); }
  var jourAuj = estMoisEnCours(m) ? new Date().getDate() : (estFutur(m) ? 0 : jours);

  var maxY = Math.max(c.confort, acc, c.central, 1) * 1.10;
  function X(j){ return gG + (j-1)/(jours-1) * (W-gG-gD); }
  function Y(v){ return H-gB - (v/maxY)*(H-gH-gB); }

  var pPlancher = [[X(1),Y(0)],[X(jours),Y(c.plancher)]];
  var pConfort  = [[X(1),Y(0)],[X(jours),Y(c.confort)]];
  var pCentral  = [[X(1),Y(0)],[X(jours),Y(c.central)]];
  var bande = "M "+X(1)+" "+Y(0)+" L "+X(jours)+" "+Y(c.plancher)+" L "+X(jours)+" "+Y(c.confort)+" Z";

  var reel = cum.slice(0, Math.max(1,jourAuj)).map(function(v,i){ return [X(i+1), Y(v)]; });
  var dernier = reel[reel.length-1];
  var dansBande = jourAuj>0 && acc <= (c.confort*jourAuj/jours)*1.02;
  var couleurReel = jourAuj===0 ? "var(--subtle)" : (dansBande ? "var(--vert)" : "var(--rouge)");

  /* jalons : échéances des charges non réglées */
  var jalons = chargesDuMois(m).map(function(ch){
    return {j: Math.min(jours, Math.max(1, ch.jour||1)), paye: chargePayee(m,ch.id), lib: ch.libelle, mt: ch.montant};
  });

  var s = '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Corridor de dépense du mois">';
  s += '<defs><linearGradient id="gBande" x1="0" y1="0" x2="1" y2="0">'
     + '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".04"/>'
     + '<stop offset="100%" stop-color="var(--accent)" stop-opacity=".16"/></linearGradient></defs>';

  /* grille de fond : semaines */
  for(var w=1; w<=jours; w+=7){
    s += '<line x1="'+X(w)+'" y1="'+gH+'" x2="'+X(w)+'" y2="'+(H-gB)+'" stroke="var(--border)" stroke-width="1" opacity=".55"/>';
    s += '<text x="'+X(w)+'" y="'+(H-gB+18)+'" fill="var(--subtle)" font-size="'+(estroit?10:11)+'" font-family="var(--mono)" text-anchor="middle">'+w+'</text>';
  }
  s += '<line x1="'+gG+'" y1="'+(H-gB)+'" x2="'+(W-gD)+'" y2="'+(H-gB)+'" stroke="var(--border-fort)" stroke-width="1"/>';

  s += '<path d="'+bande+'" fill="url(#gBande)"/>';
  s += '<path d="'+ligne(pConfort)+'" stroke="var(--accent)" stroke-width="1.5" fill="none" opacity=".8"/>';
  s += '<path d="'+ligne(pPlancher)+'" stroke="var(--accent)" stroke-width="1" fill="none" opacity=".45" stroke-dasharray="2 4"/>';
  s += '<path d="'+ligne(pCentral)+'" stroke="var(--bleu)" stroke-width="1.25" fill="none" stroke-dasharray="6 4"/>';

  jalons.forEach(function(jl){
    s += '<line x1="'+X(jl.j)+'" y1="'+(H-gB-6)+'" x2="'+X(jl.j)+'" y2="'+(H-gB+6)+'" stroke="'+(jl.paye?"var(--vert)":"var(--accent)")+'" stroke-width="2.5" stroke-linecap="round"><title>'+ech(jl.lib)+' — '+fmtD(jl.mt)+(jl.paye?" (réglé)":" (à régler)")+'</title></line>';
  });

  if(reel.length>1) s += '<path d="'+ligne(reel)+'" stroke="'+couleurReel+'" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>';
  if(dernier){
    s += '<circle cx="'+dernier[0]+'" cy="'+dernier[1]+'" r="4" fill="'+couleurReel+'"/>';
    s += '<line x1="'+dernier[0]+'" y1="'+gH+'" x2="'+dernier[0]+'" y2="'+(H-gB)+'" stroke="var(--text)" stroke-width="1" opacity=".2"/>';
  }

  /* étiquettes à droite */
  function etiq(y,txt,sub,col){
    var out = '<text x="'+(W-gD+8)+'" y="'+(y+3)+'" fill="'+col+'" font-size="'+(estroit?10.5:11.5)+'" font-family="var(--mono)">'+txt+'</text>';
    if(!estroit) out += '<text x="'+(W-gD+8)+'" y="'+(y+16)+'" fill="var(--subtle)" font-size="10">'+sub+'</text>';
    return out;
  }
  var yC = Y(c.confort), yM = Y(c.central), yP = Y(c.plancher);
  if(Math.abs(yC-yM)<22) yM = yC+22;
  if(Math.abs(yM-yP)<22) yP = yM+22;
  s += etiq(yC, fmt(c.confort), "confort", "var(--accent)");
  s += etiq(yM, fmt(c.central), "besoin typique", "var(--bleu)");
  s += etiq(yP, fmt(c.plancher), "minimum vital", "var(--subtle)");
  if(dernier) s += etiq(Math.min(H-gB-4, Math.max(gH+10, dernier[1]-30)), fmt(acc), "dépensé", couleurReel);
  s += '</svg>';
  return s;
}

/* Historique : revenus encaissés contre dépenses, 12 derniers mois */
function svgHistorique(m){
  var W=largeurGraph(), estroit = W<460, H=estroit?190:210, gG=estroit?38:48, gD=6, gH=14, gB=estroit?30:34;
  var mois = historique(m, 11).concat([m]);
  var rev = mois.map(totalRevenusEncaisses);
  var dep = mois.map(totalDepensesMois);
  var maxY = Math.max.apply(null, rev.concat(dep).concat([1])) * 1.12;
  var n = mois.length;
  var pas = (W-gG-gD)/n, lb = Math.min(15, pas*0.34);
  function Y(v){ return H-gB - (v/maxY)*(H-gH-gB); }

  var s = '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Revenus et dépenses sur douze mois">';
  [0,0.5,1].forEach(function(f){
    var y = Y(maxY*f);
    s += '<line x1="'+gG+'" y1="'+y+'" x2="'+(W-gD)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    s += '<text x="'+(gG-8)+'" y="'+(y+4)+'" fill="var(--subtle)" font-size="9.5" font-family="var(--mono)" text-anchor="end">'+fmt(maxY*f)+'</text>';
  });
  mois.forEach(function(mm,i){
    var x = gG + i*pas + pas/2;
    var hr = (H-gB)-Y(rev[i]), hd = (H-gB)-Y(dep[i]);
    s += '<rect x="'+(x-lb-1)+'" y="'+Y(rev[i])+'" width="'+lb+'" height="'+Math.max(0,hr)+'" fill="var(--vert)" rx="2" opacity=".9"><title>'+libelleMois(mm)+' — revenus '+fmtD(rev[i])+'</title></rect>';
    s += '<rect x="'+(x+1)+'" y="'+Y(dep[i])+'" width="'+lb+'" height="'+Math.max(0,hd)+'" fill="var(--rouge)" rx="2" opacity=".85"><title>'+libelleMois(mm)+' — dépenses '+fmtD(dep[i])+'</title></rect>';
    if(!estroit ? (i%2===0 || n<8) : (i%3===0)) s += '<text x="'+x+'" y="'+(H-gB+16)+'" fill="var(--subtle)" font-size="9.5" text-anchor="middle">'+MOIS_FR[moisEnDate(mm).getMonth()].slice(0,3)+'</text>';
  });
  s += '</svg>';
  return s;
}

/* Répartition par poste : réel du mois contre prévision statistique */
function svgCategories(m){
  var pv = previsionsCategories(m).filter(function(p){ return p.reel>0 || p.prevu>0; }).slice(0,9);
  if(!pv.length) return '<p class="aide">Aucune dépense variable saisie pour ce mois.</p>';
  var maxV = Math.max.apply(null, pv.map(function(p){ return Math.max(p.reel,p.prevu); }).concat([1]));
  var W = largeurGraph(), estroit = W<460;
  var h = estroit?38:34, gG=estroit?104:176, gD=estroit?66:104, H = pv.length*h + 10;
  var trunc = estroit?13:21;
  var s = '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Dépenses par poste">';
  pv.forEach(function(p,i){
    var y = i*h + 8, L = W-gG-gD;
    var wr = (p.reel/maxV)*L, wp = (p.prevu/maxV)*L;
    var depasse = p.prevu>0 && p.reel > p.prevu*1.15;
    s += '<text x="'+(gG-10)+'" y="'+(y+13)+'" fill="var(--text)" font-size="'+(estroit?11:12.5)+'" text-anchor="end">'+ech(p.cat.nom.length>trunc?p.cat.nom.slice(0,trunc-1)+"…":p.cat.nom)+'</text>';
    if(!estroit) s += '<text x="'+(gG-10)+'" y="'+(y+25)+'" fill="var(--subtle)" font-size="10" text-anchor="end">'+p.stabilite+'</text>';
    s += '<rect x="'+gG+'" y="'+y+'" width="'+L+'" height="16" fill="var(--surface-2)" rx="3"/>';
    s += '<rect x="'+gG+'" y="'+y+'" width="'+Math.max(2,wr)+'" height="16" fill="'+(depasse?"var(--rouge)":"var(--vert)")+'" rx="3" opacity=".9"/>';
    if(p.prevu>0) s += '<line x1="'+(gG+wp)+'" y1="'+(y-2)+'" x2="'+(gG+wp)+'" y2="'+(y+18)+'" stroke="var(--accent)" stroke-width="2"><title>prévu '+fmtD(p.prevu)+'</title></line>';
    s += '<text x="'+(W-gD+8)+'" y="'+(y+12)+'" fill="var(--text)" font-size="'+(estroit?10.5:11.5)+'" font-family="var(--mono)">'+fmt(p.reel)+'</text>';
    if(p.prevu>0 && !estroit) s += '<text x="'+(W-gD+8)+'" y="'+(y+24)+'" fill="var(--subtle)" font-size="10" font-family="var(--mono)">~'+fmt(p.prevu)+'</text>';
  });
  s += '</svg>';
  return s;
}

/* Projection de trésorerie : trois scénarios sur six mois */
function svgProjection(m){
  var pr = projection(m, 6);
  var W=largeurGraph(), estroit = W<460, H=estroit?210:230, gG=estroit?48:56, gD=10, gH=16, gB=estroit?30:34;
  var toutes = pr.scen.pessimiste.concat(pr.scen.attendu, pr.scen.optimiste);
  var maxY = Math.max.apply(null, toutes), minY = Math.min.apply(null, toutes.concat([0]));
  var etendue = (maxY-minY) || 1;
  maxY += etendue*0.1; minY -= etendue*0.1;
  var n = pr.mois.length;
  function X(i){ return gG + i/(n-1)*(W-gG-gD); }
  function Y(v){ return H-gB - ((v-minY)/(maxY-minY))*(H-gH-gB); }

  var s = '<svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projection de trésorerie sur six mois">';
  [0,0.5,1].forEach(function(f){
    var v = minY + (maxY-minY)*f, y = Y(v);
    s += '<line x1="'+gG+'" y1="'+y+'" x2="'+(W-gD)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    s += '<text x="'+(gG-8)+'" y="'+(y+4)+'" fill="var(--subtle)" font-size="9.5" font-family="var(--mono)" text-anchor="end">'+fmt(v)+'</text>';
  });
  if(minY < 0 && maxY > 0) s += '<line x1="'+gG+'" y1="'+Y(0)+'" x2="'+(W-gD)+'" y2="'+Y(0)+'" stroke="var(--rouge)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>';

  var aire = pr.scen.optimiste.map(function(v,i){ return [X(i),Y(v)]; })
       .concat(pr.scen.pessimiste.map(function(v,i){ return [X(i),Y(v)]; }).reverse());
  s += '<path d="'+ligne(aire)+' Z" fill="var(--bleu)" opacity=".10"/>';
  s += '<path d="'+ligne(pr.scen.optimiste.map(function(v,i){return [X(i),Y(v)];}))+'" stroke="var(--vert)" stroke-width="1.25" fill="none" stroke-dasharray="3 3"/>';
  s += '<path d="'+ligne(pr.scen.pessimiste.map(function(v,i){return [X(i),Y(v)];}))+'" stroke="var(--rouge)" stroke-width="1.25" fill="none" stroke-dasharray="3 3"/>';
  s += '<path d="'+ligne(pr.scen.attendu.map(function(v,i){return [X(i),Y(v)];}))+'" stroke="var(--accent)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>';
  pr.mois.forEach(function(mm,i){
    if(i%1===0) s += '<text x="'+X(i)+'" y="'+(H-gB+16)+'" fill="var(--subtle)" font-size="9.5" text-anchor="middle">'+MOIS_FR[moisEnDate(mm).getMonth()].slice(0,3)+'</text>';
  });
  s += '</svg>';
  return s;
}

/* Anneau de score */
function svgScore(v){
  var R=52, C=2*Math.PI*R, off = C*(1-v/100);
  var col = v>=75 ? "var(--vert)" : v>=50 ? "var(--accent)" : "var(--rouge)";
  return '<svg width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Score de santé financière '+v+' sur 100">'
    + '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="var(--surface-2)" stroke-width="9"/>'
    + '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round"'
    + ' stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 64 64)"/>'
    + '<text x="64" y="66" text-anchor="middle" fill="var(--text)" font-size="30" font-family="var(--mono)" font-weight="600">'+v+'</text>'
    + '<text x="64" y="84" text-anchor="middle" fill="var(--subtle)" font-size="10">sur 100</text></svg>';
}

function optionsCategories(sel){
  // Affiche le reste disponible pour les postes dotés d'un budget : on choisit

  var etats = {};

  return S.categories.map(function(c){

/* ---------- Tableau de bord ---------- */
function vueBord(){
  var m = S.moisActif;
  var c = corridor(m), r = resteAVivre(m), tr = tresorerie(m), at = atterrissage(m);
  var restantes = chargesRestantes(m);
  var mtRestant = somme(restantes.map(function(x){return x.montant;}));
  var dues = chargesDuMois(m);
  var h = "";

  if(!S.charges.length && !S.transactions.length && !S.revenusRecurrents.length){
    return '<div class="vide">'
      + '<h3>Commençons par le socle</h3>'
      + '<p>Renseignez d\'abord vos charges obligatoires — loyer, école, électricité, connexion, ce que vous devez payer chaque mois quoi qu\'il arrive. Puis vos revenus réguliers. Le reste se construit tout seul au fil de vos saisies.</p>'
      + '<button class="btn primaire" data-act="aller" data-vue="charges">Saisir mes charges obligatoires</button> '
      + '<button class="btn" data-act="demo">Charger un exemple pour explorer</button>'
      + '</div>';
  }

  /* Bandeau de rappel */

    });
    h += '<div class="rappel'+(urgentes.length?' grave':'')+'">'
      + '<div class="txt">Ce mois, <strong>'+fmtD(mtRestant)+'</strong> de charges obligatoires ne sont pas encore réglées'
      + (urgentes.length ? ' — dont <strong>'+urgentes.length+'</strong> dont l\'échéance approche ou est dépassée' : '')
      + '. Mettez cette somme de côté avant toute autre dépense.<br>'
      + '<span class="aide">'+(dues.length-restantes.length)+' sur '+dues.length+' déjà réglées.</span></div>'
      + '<button class="btn primaire" data-act="aller" data-vue="charges">Pointer mes charges</button></div>';
  } else if(dues.length){
    h += '<div class="rappel"><div class="txt">Toutes vos charges obligatoires du mois sont réglées — <strong>'+fmtD(c.fixe)+'</strong> couverts. Le reste du budget est à vous.</div></div>';
  }

  /* KPI */
  var dispoClass = r.disponible < 0 ? "alerte" : r.disponible > c.central*0.1 ? "bien" : "";
  h += '<div class="grille g4">'
    + '<div class="kpi majeur animate-in"><span class="lab">Rythme tenable</span>'
      + '<span class="val num">'+fmt(Math.max(0,r.parJour))+'</span>'
      + '<span class="sub">par jour, sur '+r.joursRestants+' jour(s) restant(s)</span></div>'
    + '<div class="kpi '+dispoClass+' animate-in d1"><span class="lab">Reste à dépenser</span>'
      + '<span class="val num">'+fmt(r.disponible)+'</span>'
      + '<span class="sub">après charges et épargne cible</span></div>'
    + '<div class="kpi animate-in d2"><span class="lab">Besoin du mois</span>'
      + '<span class="val num">'+fmt(c.central)+'</span>'
      + '<span class="sub">entre '+fmt(c.plancher)+' et '+fmt(c.confort)+' · fiabilité '+c.fiabilite+'</span></div>'
    + '<div class="kpi '+(at.epargne>=c.epargneCible?'bien':at.epargne<0?'alerte':'')+' animate-in d3"><span class="lab">Atterrissage épargne</span>'
      + '<span class="val num">'+fmt(at.epargne)+'</span>'
      + '<span class="sub">fin de mois projetée · cible '+fmt(c.epargneCible)+' · autonomie '+(Math.round(tr.autonomie*10)/10).toString().replace(".",",")+' mois</span></div>'
    + '</div>';

  /* Portefeuilles : résumé compact */

    var soustitre = Tp.depasses ? Tp.depasses+' dépassé'+(Tp.depasses>1?'s':'')
                  : Tp.aSurveiller ? Tp.aSurveiller+' à surveiller'

      + '<div class="titre-bloc"><div><span class="eyebrow">'+soustitre+'</span>'

      + '<span class="portef-chiffres num">'+fmt(Tp.depense)+' <span style="color:var(--subtle)">/ '+fmt(Tp.budget)+'</span></span></div>'
      + '<div class="pf-mini">';

      var partAff = Math.min(100, Math.max(0, p.part));
      h += '<div class="pf-mini-l">'
        + '<span class="pf-mini-nom"><span>'+ech(p.cat.nom)+'</span></span>'
        + '<span class="pf-mini-val" style="color:'+couleurStatut(p.statut)+'">'

    + '<p class="aide">Votre dépense cumulée, jour après jour, contre la trajectoire que vos '+c.nMois+' mois d\'historique jugent tenable. Tant que la courbe reste dans la bande, le mois se termine sans casse.</p></div></div>'

  h += '<div class="carte"><div class="titre-bloc"><h3>Conseils du moment</h3><span class="eyebrow">calculés sur vos données</span></div>';
  var cs = conseils(m).slice(0,6);
  cs.forEach(function(x){
    h += '<div class="conseil '+x.p+'"><span class="pic">'+x.i+'</span><div><h4>'+x.t+'</h4><p>'+x.d+'</p></div></div>';
  });

    + '<div class="carte"><div class="titre-bloc"><h3>Saisie rapide</h3></div>'
    + formulaireDepense()

    h += '<div class="carte"><div class="titre-bloc"><h3>Charges du mois</h3>'
      + '<span class="eyebrow">'+(dues.length-restantes.length)+'/'+dues.length+'</span></div><div class="liste">';
    dues.slice(0,6).forEach(function(ch){

      h += '<div class="item'+(paye?' paye':'')+'">'

        + '<span class="nom">'+ech(ch.libelle)+'<br><span class="meta">le '+(ch.jour||1)+'</span></span>'
        + '<span class="mt">'+fmt(ch.montant)+'</span></div>';
    });
    h += '</div>';
    if(dues.length>6) h += '<button class="btn discret mini" data-act="aller" data-vue="charges" style="margin-top:var(--space-3)">Voir les '+dues.length+' charges →</button>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

function vueDepenses(){
  var m = S.moisActif;
  var tx = txMois(m,"variable").sort(function(a,b){ return b.date.localeCompare(a.date); });
  var pv = previsionsCategories(m);
  var rec = recurrencesDetectees(m);
  var h = "";

  h += '<div class="carte animate-in"><div class="titre-bloc"><div><h2>Saisir une dépense</h2>'
    + '<p class="aide">Plus la saisie est fidèle, plus le corridor devient précis. Même 500 F comptent : ce sont les petites lignes répétées qui font disparaître un budget.</p></div></div>'
    + formulaireDepense() + '</div>';

  if(rec.length){
    h += '<div class="carte animate-in d1"><div class="titre-bloc"><h3>Ces postes reviennent chaque mois</h3><span class="eyebrow">détection automatique</span></div>'
      + '<p class="aide" style="margin-bottom:var(--space-4)">Vous dépensez régulièrement dans ces postes, avec un montant stable. Les passer en charge fixe les fera entrer dans la somme que vous provisionnez d\'avance.</p><div class="liste">';
    rec.forEach(function(x){
      h += '<div class="item"><span class="nom">'+ech(x.cat.nom)+'<br><span class="meta">'+x.mois+' mois de suite · variation '+pct(x.cv*100)+'</span></span>'

        + '<button class="btn mini" data-act="fixerRecurrence" data-id="'+x.cat.id+'" data-mt="'+x.montant+'">En faire une charge fixe</button></div>';
    });

  h += '<div class="carte animate-in d2"><div class="titre-bloc"><div><h3>Budgets par poste</h3>'
    + '<p class="aide">Les budgets se règlent dans l\'onglet Portefeuilles, à un seul endroit pour éviter les réglages contradictoires.</p></div></div>';

        + '<span class="pf-mini-val" style="color:'+couleurStatut(p.statut)+'">'
        +   (p.restant<0 ? '\u2212'+fmt(Math.abs(p.restant)) : fmt(p.restant)+' restant')+'</span>'
        + '<div class="jauge"><i class="'+classeJauge(p.statut)+'" style="width:'+partAff+'%"></i></div>'
        + '</div>';
    });
    h += '</div>';
  } else {
    h += '<p class="aide">Aucun budget défini pour l\'instant. Un portefeuille par thème \u2014 cuisine, loisirs, transport \u2014 et vous verrez fondre ce qu\'il reste au fil du mois.</p>';
  }
  h += '<button class="btn'+(pfA.length?' discret mini':' primaire large')+'" data-act="aller" data-vue="portefeuilles" style="margin-top:var(--space-4)">'
    + (pfA.length ? 'G\u00e9rer mes portefeuilles \u2192' : 'Cr\u00e9er mon premier portefeuille') + '</button>';
  h += '</div>';

  /* Journal */
  h += '<div class="carte animate-in d3"><div class="titre-bloc"><h3>Journal de '+libelleMois(m)+'</h3>'
    + '<span class="eyebrow">'+tx.length+' saisie(s) · '+fmtD(totalVariablesMois(m))+'</span></div>';
  if(!tx.length){
    h += '<div class="vide" style="padding:var(--space-8)"><h3>Aucune dépense variable ce mois</h3><p>Les charges fixes cochées apparaissent dans le budget mais pas ici : ce journal ne contient que le dépensier du quotidien, celui sur lequel vous avez la main.</p></div>';
  } else {
    h += '<div class="scroll-x"><table class="tableau"><thead><tr><th>Date</th><th>Libellé</th><th>Poste</th><th class="n">Montant</th><th></th></tr></thead><tbody>';
    tx.forEach(function(t){
      h += '<tr><td class="n" data-label="Date" style="text-align:left">'+t.date.slice(8)+'/'+t.date.slice(5,7)+'</td>'
        + '<td data-label="Libellé">'+ech(t.libelle||"—")+'</td><td data-label="Poste">'+ech(cat(t.categorieId).nom)+'</td>'
        + '<td class="n" data-label="Montant">'+fmt(t.montant)+'</td>'
        + '<td data-label="" style="text-align:right"><button class="btn discret mini" data-act="suppTx" data-id="'+t.id+'">✕</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  /* Catégories */
  h += '<div class="carte animate-in"><div class="titre-bloc"><div><h3>Vos postes de dépense</h3>'
    + '<p class="aide">Créez une ligne dès que vous remarquez que l\'argent part souvent quelque part. Un poste « essentiel » entre dans le calcul du minimum vital.</p></div></div>'
    + '<div class="ligne-form">'
    + '<div class="champ"><label for="catNom">Nouveau poste</label><input type="text" id="catNom" placeholder="Recharge internet, coiffure, dépannage…"></div>'
    + '<div class="champ"><label for="catEss">Nature</label><select id="catEss"><option value="0">Confort — compressible</option><option value="1">Essentiel — incompressible</option></select></div>'
    + '<button class="btn primaire" data-act="ajoutCat">Créer le poste</button></div>'
    + '<div class="liste" style="margin-top:var(--space-5)">';
  S.categories.forEach(function(c){
    var util = S.transactions.filter(function(t){return t.categorieId===c.id;}).length;
    h += '<div class="item"><span class="nom">'+ech(c.nom)+' '+(c.essentiel?'<span class="tag or">essentiel</span>':'')
      + '<br><span class="meta">'+util+' saisie(s)</span></span>'
      + '<button class="btn discret mini" data-act="basculeEssentiel" data-id="'+c.id+'">'+(c.essentiel?"Rendre compressible":"Marquer essentiel")+'</button>'
      + (util===0 ? '<button class="btn discret mini danger" data-act="suppCat" data-id="'+c.id+'">✕</button>' : '')
      + '</div>';
  });
  h += '</div></div>';
  return h;
}
